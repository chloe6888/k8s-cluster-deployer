---
# cqjf 集群 inventory【占位骨架】：节点数按实际增删；worker 在 workers 组下任意追加。
# 分组约定（实施方案 §3.4）：
#   masters     按 01→02→03 顺序写，该顺序即 keepalived 启动与 master 加入顺序
#   first_master 只放 master01，凡"只在 master01 上执行"的阶段都用它
#   k8s_all     masters + workers
# node_name 不单独存变量，由 cluster_prefix + 主机名拼出（与手册 ${CLUSTER_PREFIX}-k8s-master0N 一致）。
# IP 为示例值（手册附录 B 参考段），部署前必须替换。
all:
  vars:
    ansible_user: root
  children:
    k8s_all:
      children:
        masters:
          hosts:
            k8s-master01: { ansible_host: 10.1.0.1 }
            k8s-master02: { ansible_host: 10.1.0.2 }
            k8s-master03: { ansible_host: 10.1.0.3 }
        workers:
          hosts:
            k8s-worker11: { ansible_host: 10.1.0.11 }
            k8s-worker12: { ansible_host: 10.1.0.12 }
    first_master:
      hosts:
        k8s-master01: { ansible_host: 10.1.0.1 }
