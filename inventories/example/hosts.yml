---
# 示例 inventory：换集群 = 复制本目录为 inventories/<集群名>/ 并替换全部取值。
# 分组约定（实施方案 §3.4）：
#   masters     按 01→02→03 顺序写，该顺序即 keepalived 启动与 master 加入顺序
#   first_master 只放 master01，凡"只在 master01 上执行"的 play 都用它
#   k8s_all     masters + workers
# node_name 不单独存变量，由 cluster_prefix + 主机名拼出（与手册 ${CLUSTER_PREFIX}-k8s-master0N 一致）。
# 节点变量（node_ip / node_ext_ip）必须显式：worker 直接内联在下方 hosts（量多，一行一台）；
# master 的在 host_vars/（另有 ka_state/ka_priority，写错会 keepalived 脑裂，单独文件配注释更醒目）。
# IP 为文档占位值（10.100.0.0/24 内网 / 10.200.0.0/24 外网演示段），部署前必须替换。
all:
  vars:
    ansible_user: root
  children:
    k8s_all:
      children:
        masters:
          hosts:
            k8s-master01: { ansible_host: 10.100.0.1 }
            k8s-master02: { ansible_host: 10.100.0.2 }
            k8s-master03: { ansible_host: 10.100.0.3 }
        workers:
          hosts:
            k8s-worker11: { ansible_host: 10.100.0.11, node_ip: 10.100.0.11, node_ext_ip: 10.200.0.11 }
            k8s-worker12: { ansible_host: 10.100.0.12, node_ip: 10.100.0.12, node_ext_ip: 10.200.0.12 }
    first_master:
      hosts:
        k8s-master01: { ansible_host: 10.100.0.1 }
