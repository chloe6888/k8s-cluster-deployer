name: Temporary P0 simulation checks

on:
  push:
    branches:
      - fix/p0-deployment-blockers
    paths:
      - ".github/workflows/simulate-p0-checks.yml"

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-deployment-blockers

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint yamllint

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run yamllint
        run: yamllint .

      - name: Syntax-check every playbook
        shell: bash
        run: |
          set -euo pipefail
          for playbook in playbooks/*.yml; do
            echo "Checking $playbook"
            ansible-playbook -i inventories/example/hosts.yml "$playbook" --syntax-check
          done

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done

      - name: Verify repository artifact checksums
        run: scripts/verify-checksums.sh

      - name: Build offline bundle and verify generated checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-offline.sh /tmp/k8s-offline-files
          cd /tmp/k8s-offline-files
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(grep -cE '^[0-9a-f]{64}  ' SHA256SUMS)" -eq "$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)"
