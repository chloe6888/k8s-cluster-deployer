name: Temporary fresh-main audit simulation

on:
  push:
    branches:
      - audit/review-d43f929
    paths:
      - ".github/workflows/audit-review-sim.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/review-d43f929

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint yamllint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: ansible-lint
        run: ansible-lint

      - name: yamllint
        run: yamllint .

      - name: Syntax-check every playbook
        shell: bash
        run: |
          set -euo pipefail
          for playbook in playbooks/*.yml; do
            echo "Checking $playbook"
            ansible-playbook -i inventories/example/hosts.yml "$playbook" --syntax-check
          done

      - name: Shell syntax and repository checksums
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "$script"; done
          scripts/verify-checksums.sh

      - name: Package offline artifacts
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-offline.sh /tmp/offline
          cd /tmp/offline
          sha256sum -c SHA256SUMS

      - name: Reproduce run_once and set_fact fact propagation
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/inventory.ini <<'EOF'
          [nodes]
          node_a ansible_connection=local
          node_b ansible_connection=local
          EOF
          cat >/tmp/run-once.yml <<'EOF'
          - name: Demonstrate run_once fact behavior
            hosts: nodes
            gather_facts: false
            tasks:
              - name: Seed per-host failures
                ansible.builtin.set_fact:
                  verify_failures:
                    - "{{ inventory_hostname }}-local-failure"
              - name: Append the once-only cluster failure
                ansible.builtin.set_fact:
                  verify_failures: "{{ verify_failures + ['cluster-failure'] }}"
                run_once: true
              - name: Show each host's final failures
                ansible.builtin.debug:
                  msg: "{{ inventory_hostname }}={{ verify_failures | join(',') }}"
          EOF
          ansible-playbook -i /tmp/inventory.ini /tmp/run-once.yml
