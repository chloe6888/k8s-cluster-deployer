---
# 展平文件名（部署手册 1.6 / 决策 #25）→ 本仓库相对路径 的映射数据。
# 注意：Ansible 不渲染字典的键（defaults 与 set_fact 都不渲染，2026-11-26 实测，
# 决策 #40），所以这里存两个平行列表，由 tasks 在运行时 zip 成字典；
# 版本号取自 config/versions.yml（playbook 已引入），勿在此写死版本。
# 两个列表必须逐项对齐（install.yml 有长度断言），新增文件时两边同步加。
artifact_repo_flat_names:
  - "containerd-{{ containerd_version }}-linux-amd64.tar.gz"
  - "runc.amd64"
  - "runc.sha256sum"
  - "nerdctl-{{ nerdctl_version }}-linux-amd64.tar.gz"
  - "helm-v{{ helm_version }}-linux-amd64.tar.gz"
  - "Release.key"
  - "tigera-operator-v{{ calico_version }}.tgz"
  - "crd.projectcalico.org.v1-v{{ calico_version }}.tgz"
  - "metallb-{{ metallb_version }}.tgz"
  - "gateway-helm-v{{ envoy_gateway_version }}.tgz"
  - "calico-{{ calico_version }}.yaml"
  - "metallb-native-v{{ metallb_version }}.yaml"
  - "envoy-gateway-install-v{{ envoy_gateway_version }}.yaml"
  - "containerd.service"

artifact_repo_paths:
  - "artifacts/binaries/amd64/containerd/{{ containerd_version }}/containerd-{{ containerd_version }}-linux-amd64.tar.gz"
  - "artifacts/binaries/amd64/runc/{{ runc_version }}/runc.amd64"
  - "artifacts/binaries/amd64/runc/{{ runc_version }}/runc.sha256sum"
  - "artifacts/binaries/amd64/nerdctl/{{ nerdctl_version }}/nerdctl-{{ nerdctl_version }}-linux-amd64.tar.gz"
  - "artifacts/tools/helm/{{ helm_version }}/helm-v{{ helm_version }}-linux-amd64.tar.gz"
  - "artifacts/keys/kubernetes/Release.key"
  - "artifacts/charts/calico/{{ calico_version }}/tigera-operator-v{{ calico_version }}.tgz"
  - "artifacts/charts/calico/{{ calico_version }}/crd.projectcalico.org.v1-v{{ calico_version }}.tgz"
  - "artifacts/charts/metallb/{{ metallb_version }}/metallb-{{ metallb_version }}.tgz"
  - "artifacts/charts/envoy-gateway/{{ envoy_gateway_version }}/gateway-helm-v{{ envoy_gateway_version }}.tgz"
  - "artifacts/manifests/calico/{{ calico_version }}/calico.yaml"
  - "artifacts/manifests/metallb/{{ metallb_version }}/metallb-native.yaml"
  - "artifacts/manifests/envoy-gateway/{{ envoy_gateway_version }}/envoy-gateway-install.yaml"
  - "templates/systemd/containerd.service.j2"
