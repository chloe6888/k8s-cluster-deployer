---
# 公共任务：把离线安装文件获取到节点 {{ package_dir }}/ 并校验（实施方案 §2 约定 5）。
# 用法（标准写法 import_role，标签随调用方继承）：
#   - name: Fetch the Calico charts
#     ansible.builtin.import_role:
#       name: artifact
#     vars:
#       artifact_files: [a, b]
# 来源唯一（决策 #39）：控制机按本仓库 artifacts/checksums/SHA256SUMS 全量校验后推送到节点
# （文件站分发已取消；手册的手工部署流程仍走 ${FILE_URL}，与自动化无关）。
# 校验失败即中止（sha256sum -c 非零退出 / OK 行断言不过）。
- name: Import the install tasks
  ansible.builtin.import_tasks: install.yml
