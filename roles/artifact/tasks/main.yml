---
# 公共任务：把离线安装文件获取到节点 {{ package_dir }}/ 并校验（实施方案 §2 约定 5）。
# 用法（标准写法 import_role，标签随调用方继承）：
#   - name: Fetch the Calico charts
#     ansible.builtin.import_role:
#       name: artifact
#     vars:
#       artifact_files: [a, b]
# 两种来源：
#   artifact_source=file_url（默认）：节点从内网文件站下载，get_url 按 SHA256SUMS 校验（展平文件名）
#   artifact_source=repo              ：控制机按本仓库 artifacts/checksums/SHA256SUMS 校验后推送
# 校验失败即中止（get_url 的 checksum 参数 / sha256sum -c 失败都非零退出）。
- name: Import the install tasks
  ansible.builtin.import_tasks: install.yml
