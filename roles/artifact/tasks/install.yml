---
# 公共获取任务：本身不带标签——由调用方的 import_role 把所在 block 的标签传进来。
- name: Fetch and verify the artifact files
  block:
    - name: Normalize the artifact file list
      ansible.builtin.set_fact:
        artifact_list: "{{ (artifact_files | default([])) + ([artifact_file] if (artifact_file | default('')) != '' else []) }}"

    - name: Assert the artifact list is not empty
      ansible.builtin.assert:
        that: artifact_list | length > 0
        fail_msg: artifact role 需要通过 artifact_file 或 artifact_files 指定至少一个文件
        quiet: true

    - name: Ensure the node work directory exists
      ansible.builtin.file:
        path: "{{ package_dir }}"
        state: directory
        mode: "0755"

    # 决策 #39：统一从本仓库 artifacts/ 推送——控制机先按 checksums/SHA256SUMS 全量校验
    # （源头 fail-fast，不依赖文件站那份拷贝），再经 SSH 推给节点；copy 幂等，重跑跳过未变文件
    - name: Push from the repository
      block:
        # 决策 #40：字典键不渲染模板，defaults 里存平行列表、这里 zip 成字典（列表元素会渲染）
        - name: Assert the mapping lists are aligned
          ansible.builtin.assert:
            that: artifact_repo_flat_names | length == artifact_repo_paths | length
            fail_msg: artifact_repo_flat_names 与 artifact_repo_paths 长度不一致（roles/artifact/defaults/main.yml），逐项对齐后重试
            quiet: true

        - name: Map flat names to repository paths
          ansible.builtin.set_fact:
            artifact_repo_map: "{{ dict(artifact_repo_flat_names | zip(artifact_repo_paths)) | combine(artifact_repo_map_extra | default({})) }}"

        - name: Assert every file is in the mapping
          ansible.builtin.assert:
            that: item in artifact_repo_map
            fail_msg: "文件 {{ item }} 不在 artifact_repo_map 映射表内（roles/artifact/defaults/main.yml），请补映射"
            quiet: true
          loop: "{{ artifact_list }}"
          loop_control:
            label: "{{ item }}"

        # 决策 #50：按文件两步校验，替代整份清单 --ignore-missing 全量校验。
        # ① 旧断言行 "expr ~ ': OK' in stdout_lines" 未整体加引号，": " 被 YAML
        #   当映射分隔符拆成单键字典——解析器实证从未求值、恒真通过，
        #   --ignore-missing 的静默放行从未被兜住；
        # ② 整份清单一次校验：任一无关文件损坏会连坐全部取包失败，报错还指向
        #   第一个请求的文件（篡改 metallb chart 报 containerd 的实测案例）。
        # 新法：grep -F 取该文件的清单行（缺失或多条都在第一步拦下，
        # 报"清单里应有且仅有一条"），再把这一行喂给 sha256sum -c - 只校验
        # 本次请求的文件。templates/ 下的映射（如 containerd.service）不在清单内，跳过
        - name: Fetch the manifest line of each requested file
          ansible.builtin.command:
            cmd: grep -F -- {{ (artifact_repo_map[item] | regex_replace('^artifacts/', '')) | quote }} checksums/SHA256SUMS
          args:
            chdir: "{{ playbook_dir }}/../artifacts"
          delegate_to: localhost
          run_once: true
          loop: "{{ artifact_list }}"
          loop_control:
            label: "{{ item }}"
          when: artifact_repo_map[item] is match('^artifacts/')
          register: artifact_manifest_line
          changed_when: false
          failed_when: >-
            artifact_manifest_line.rc != 0
            or (artifact_manifest_line.stdout_lines | default([]) | length) != 1
          check_mode: false

        - name: Verify each requested file against its manifest line
          ansible.builtin.command:
            cmd: sha256sum -c -
            stdin: "{{ item.stdout }}"
          args:
            chdir: "{{ playbook_dir }}/../artifacts"
          delegate_to: localhost
          run_once: true
          loop: "{{ artifact_manifest_line.results }}"
          loop_control:
            label: "{{ item.item }}"
          # 上一步被 when 跳过的映射项（templates/ 路径）没有 stdout 键
          when: item.stdout is defined
          register: artifact_file_verify
          changed_when: false
          check_mode: false

        - name: Push files to the node
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../{{ artifact_repo_map[item] }}"
            dest: "{{ package_dir }}/{{ item }}"
            mode: "0644"
          loop: "{{ artifact_list }}"
          loop_control:
            label: "{{ item }}"
