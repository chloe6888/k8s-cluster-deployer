---
# 公共获取任务：本身不带标签——由调用方的 import_role 把所在 block 的标签传进来。
- name: Fetch and verify the artifact files
  block:
    - name: Normalize the artifact file list
      ansible.builtin.set_fact:
        artifact_list: "{{ (artifact_files | default([])) + ([artifact_file] if (artifact_file | default('')) != '' else []) }}"

    - name: Assert the artifact list is not empty
      ansible.builtin.assert:
        that: artifact_list | length > 0
        fail_msg: artifact role 需要通过 artifact_file 或 artifact_files 指定至少一个文件
        quiet: true

    - name: Ensure the node work directory exists
      ansible.builtin.file:
        path: "{{ package_dir }}"
        state: directory
        mode: "0755"

    # 决策 #25：文件站清单条目为展平文件名
    - name: Fetch from the file station
      when: artifact_source == 'file_url'
      block:
        - name: Download SHA256SUMS
          ansible.builtin.get_url:
            url: "{{ file_url }}/SHA256SUMS"
            dest: "{{ package_dir }}/SHA256SUMS"
            mode: "0644"

        - name: Extract the checksum of each file
          ansible.builtin.command:
            cmd: awk -v f={{ item }} '$2==f {print $1}' {{ package_dir }}/SHA256SUMS
          loop: "{{ artifact_list }}"
          loop_control:
            label: "{{ item }}"
          register: artifact_sums
          changed_when: false
          check_mode: false

        # 手册 1.6：条目缺失说明文件站清单与手册不一致
        - name: Assert checksums exist and are well-formed
          ansible.builtin.assert:
            that:
              - item.stdout | length == 64
              - item.stdout is match('^[0-9a-f]{64}$')
            fail_msg: >-
              SHA256SUMS 中找不到 {{ artifact_list[idx] }} 的条目（或格式错误）。
              文件站 {{ file_url }} 的清单须覆盖手册 1.6 全部文件（展平文件名，决策 #25）。
            quiet: true
          loop: "{{ artifact_sums.results }}"
          loop_control:
            label: "{{ artifact_list[idx] }}"
            index_var: idx

        - name: Download files with checksum verification
          ansible.builtin.get_url:
            url: "{{ file_url }}/{{ artifact_list[idx] }}"
            dest: "{{ package_dir }}/{{ artifact_list[idx] }}"
            checksum: "sha256:{{ item.stdout }}"
            mode: "0644"
            timeout: 300
          loop: "{{ artifact_sums.results }}"
          loop_control:
            label: "{{ artifact_list[idx] }}"
            index_var: idx
          register: artifact_downloaded

    # 仓库模式：控制机先按 artifacts/checksums/SHA256SUMS 校验，再推送节点
    - name: Push from the repository
      when: artifact_source == 'repo'
      block:
        - name: Map flat names to repository paths
          ansible.builtin.set_fact:
            artifact_repo_map: "{{ artifact_repo_map_defaults | combine(artifact_repo_map_extra | default({})) }}"

        - name: Assert every file is in the mapping
          ansible.builtin.assert:
            that: item in artifact_repo_map
            fail_msg: "文件 {{ item }} 不在 artifact_repo_map 映射表内，无法从仓库推送；请补映射或改用 artifact_source=file_url"
            quiet: true
          loop: "{{ artifact_list }}"
          loop_control:
            label: "{{ item }}"

        # 决策 #25：仓库清单条目是 artifacts/ 内相对路径（无前缀）。清单一次全量校验，
        # --ignore-missing 会把缺失文件静默当通过，所以必须再断言每个映射文件的
        # "<相对路径>: OK" 确实在输出里；templates/ 下的映射（如 containerd.service）
        # 不在清单内，跳过
        - name: Verify against the repository SHA256SUMS
          ansible.builtin.command:
            cmd: sha256sum -c --ignore-missing checksums/SHA256SUMS
          args:
            chdir: "{{ playbook_dir }}/../artifacts"
          delegate_to: localhost
          run_once: true
          register: artifact_repo_verify
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Assert every mapped file passed verification
          ansible.builtin.assert:
            that:
              - artifact_repo_verify.rc == 0
              - (artifact_repo_map[item] | regex_replace('^artifacts/', '')) ~ ': OK' in artifact_repo_verify.stdout_lines
            fail_msg: >-
              {{ item }}（{{ artifact_repo_map[item] }}）未通过校验：
              artifacts/checksums/SHA256SUMS 的 OK 行里没有它。
              sha256sum -c 输出：{{ artifact_repo_verify.stdout_lines | default([]) | join('；') }}
            quiet: true
          loop: "{{ artifact_list }}"
          loop_control:
            label: "{{ item }}"
          when: artifact_repo_map[item] is match('^artifacts/')
          run_once: true

        - name: Push files to the node
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../{{ artifact_repo_map[item] }}"
            dest: "{{ package_dir }}/{{ item }}"
            mode: "0644"
          loop: "{{ artifact_list }}"
          loop_control:
            label: "{{ item }}"
