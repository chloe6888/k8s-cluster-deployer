---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart haproxy
  ansible.builtin.systemd:
    name: haproxy
    state: restarted

- name: Restart keepalived (only when running)
  ansible.builtin.systemd:
    name: keepalived
    state: restarted
  when: "'keepalived.service' in ansible_facts.services and ansible_facts.services['keepalived.service']['state'] == 'running'"
