---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart haproxy
  ansible.builtin.systemd:
    name: haproxy
    state: restarted

# 仅已启动时重启：配置变更时未启动的节点不拉起（有序启动由 ha_keepalived 控制）
- name: Restart keepalived
  ansible.builtin.systemd:
    name: keepalived
    state: restarted
  when: ansible_facts['services'].get('keepalived.service', {}).get('state', 'stopped') == 'running'
