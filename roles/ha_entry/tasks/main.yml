---
# 阶段 20 上半段：安装并配置 HAProxy / keepalived，三台 master 并行。
# keepalived 的有序启动在 ha_keepalived role（serial play）。
- name: Install haproxy / keepalived / socat  # 修订 3：健康检查脚本需要 socat
  ansible.builtin.apt:
    name: [haproxy, keepalived, socat]
    state: present
    update_cache: false
  register: ha_install
  tags: [ha, haproxy]

- name: Stop both services right after install  # 手册 3.1；默认配置的 haproxy 会被 apt 拉起
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop: [haproxy, keepalived]
  when: ha_install is changed
  tags: [ha, haproxy]

- name: Write the HAProxy configuration (validated by haproxy -c)  # 手册 3.2；no_log
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: haproxy
    mode: "0640"
    validate: haproxy -c -f %s
  no_log: true
  notify: Restart haproxy
  tags: [ha, haproxy]

- name: Write the health-check script  # 手册 3.3；修订 9
  ansible.builtin.template:
    src: check-haproxy.sh.j2
    dest: /etc/keepalived/check-haproxy.sh
    owner: root
    group: root
    mode: "0755"
  tags: [ha, keepalived]

- name: Write the keepalived configuration (validated by keepalived -t)  # 手册 3.4；no_log
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0600"
    validate: keepalived -t -f %s
  no_log: true
  notify: Restart keepalived (only when running)
  tags: [ha, keepalived]

- name: Order keepalived after HAProxy via a systemd drop-in  # 手册 3.5
  ansible.builtin.copy:
    dest: /etc/systemd/system/keepalived.service.d/10-after-haproxy.conf
    mode: "0644"
    content: |
      [Unit]
      After=haproxy.service
      Wants=haproxy.service
  notify: Reload systemd
  tags: [ha, keepalived]

- name: Hold the haproxy / keepalived versions  # 手册 3.5
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [haproxy, keepalived]
  tags: [ha]

- name: Start and enable HAProxy on all masters in parallel  # 手册 3.5
  ansible.builtin.systemd:
    name: haproxy
    state: started
    enabled: true
  tags: [ha, haproxy]

- name: Flush handlers before verification
  ansible.builtin.meta: flush_handlers
