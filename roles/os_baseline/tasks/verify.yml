---
# 只读核对基线终态（手册 2.2/2.3/2.4/2.6/2.7）。
- name: Verify the OS baseline
  tags: [os, verify]
  block:
    # 手册 2.2：gather 发生在应用 sysctl 之前，故不用 facts 而是现读。
    # 期望值取单一事实源 os_sysctl_expect（决策 #46），迭代内自比较
    # （#42 教训①：loop 的 failed_when 只见当前迭代结果，不做 results[N]
    # 位置对位——旧结构两份清单按位置对齐，正是 #40 ④ 误判的根源）
    - name: Verify the nine sysctl values match the manual
      ansible.builtin.command:
        cmd: sysctl -n {{ item.key }}
      loop: "{{ os_sysctl_expect | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: os_sysctl_read
      changed_when: false
      failed_when: >-
        os_sysctl_read.rc != 0
        or (os_sysctl_read.stdout | trim) != item.value
      check_mode: false

    - name: Verify swap is disabled
      ansible.builtin.command:
        cmd: swapon --show
      register: os_swapon_after
      changed_when: false
      failed_when: os_swapon_after.stdout | trim != ''
      check_mode: false

    - name: Verify nftables is masked and inactive
      ansible.builtin.command:
        cmd: systemctl show -p UnitFileState -p ActiveState nftables
      register: os_nft_state
      changed_when: false
      # systemctl show 不保证 -p 参数的输出顺序（#42：用户实测顺序相反），
      # 且逐行 difference 只保证单边包含——缺一行也放行（实测单输出
      # ActiveState=inactive 即过）。排序后整体相等：顺序无关、缺行必拦
      failed_when: (os_nft_state.stdout_lines | sort) != (['UnitFileState=masked', 'ActiveState=inactive'] | sort)
      check_mode: false

    # 手册 2.6（决策 #46）：resolved 必须 active，且 /run 上游文件里有真实
    # nameserver——kubelet 的 resolvConf 将指向该文件，读到 127.0.0.53
    # stub（resolved 死着）就是 CoreDNS 上游回环
    - name: Verify systemd-resolved is active
      ansible.builtin.command:
        cmd: systemctl is-active systemd-resolved
      register: os_resolved_active
      changed_when: false
      failed_when: (os_resolved_active.stdout | trim) != 'active'
      check_mode: false

    - name: Verify the resolved upstream resolv.conf has real nameservers
      ansible.builtin.command:
        cmd: grep ^nameserver /run/systemd/resolve/resolv.conf
      register: os_resolved_ns
      changed_when: false
      # 文件缺失/无 nameserver 行都会 rc!=0；出现 127.0.0.53 说明拿到的是 stub
      failed_when: os_resolved_ns.rc != 0 or '127.0.0.53' in os_resolved_ns.stdout
      check_mode: false

    # 初次同步最多等 2 分钟（24 次 × 5 秒）；先确认有输出再匹配已同步源（^\*）
    - name: Verify chrony has at least one usable source
      ansible.builtin.command:
        cmd: chronyc sources
      register: os_chrony_sources
      until:
        - os_chrony_sources.stdout | length > 0
        - os_chrony_sources.stdout is match('(?s)^.*\^\*')
      retries: 24
      delay: 5
      changed_when: false
      check_mode: false
