---
# 系统基线（手册 2.1–2.4、2.6–2.8），全部节点并行。幂等要求：第二次运行 changed=0。
- name: Apply the OS baseline
  tags: [os]
  block:
    # 手册 2.1（决策 #44/#45）：主机名与 /etc/hosts 均在节点创建阶段配置好，
    # 本工程不代改不代写，只核对。每个节点名必须解析到该节点的内网 IP
    # （etcd peer 与 apiserver 直连都按节点名寻址，解析缺失/解析到外网 IP
    # 会在 kubeadm 阶段才炸，这里提前拦下）。
    # 用 ahostsv4 而非 hosts：后者可能优先返回 IPv6（实测 localhost 返回 ::1）
    - name: Verify each node name resolves to its internal IP
      ansible.builtin.command:
        cmd: getent ahostsv4 {{ item }}
      loop: "{{ groups['k8s_all'] }}"
      loop_control:
        label: "{{ item }}"
      register: os_node_resolve
      changed_when: false
      failed_when: >-
        os_node_resolve.rc != 0
        or (os_node_resolve.stdout.split()[0] | default('')) != hostvars[item]['node_ip']
      check_mode: false

    # 手册 2.1：节点名核对后，确认 Harbor 域名也可解析（镜像预取依赖）
    - name: Verify Harbor hostname resolution
      ansible.builtin.command:
        cmd: getent hosts {{ harbor.split(':')[0] }}
      register: os_harbor_check
      changed_when: false
      check_mode: false

    # 手册 2.2/2.3：开机加载清单，单一事实源 os_modules_load（决策 #46：
    # 原先同一清单写 4 处——两个文件内容、立即加载 loop、handler loop）
    - name: Persist the modules-load.d fragments
      ansible.builtin.copy:
        dest: "/etc/modules-load.d/{{ item.key }}"
        content: "{{ item.value | join(nl) }}{{ nl }}"
        mode: "0644"
      vars:
        nl: "\n"
      loop: "{{ os_modules_load | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # 手册 2.2/2.3：立即加载，不等重启。modprobe 幂等、每次全量执行，
    # 原先为此挂的 Reload kernel modules handler 属纯冗余（决策 #46 删）
    - name: Load kernel modules immediately
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: "{{ os_modules_load.values() | flatten }}"

    # 手册 2.2：rp_filter 显式写入，防加固基线把 2 改回 1，勿因与默认重复而删除
    - name: Write the nine sysctl parameters
      ansible.builtin.template:
        src: k8s-sysctl.conf.j2
        dest: /etc/sysctl.d/k8s.conf
        mode: "0644"
      register: os_sysctl_file

    # 手册 2.2：必须立即生效（后续 kubelet 依赖），不能延迟到 handler，故不用 no-handler 写法
    - name: Apply sysctl via sysctl --system
      ansible.builtin.command:
        cmd: sysctl --system
      when: os_sysctl_file is changed
      changed_when: os_sysctl_file is changed

    # 手册 2.3：只用 CLI，不用服务（服务起来会 flush ruleset）
    - name: Install the nftables CLI tools
      ansible.builtin.apt:
        name: nftables
        state: present
        update_cache: false

    # 手册 2.3：装完就关——不启动、不开机启动；mask 防日后误启动
    # （start / reload 会先 flush ruleset，清掉 kube-proxy / Calico 的表）
    - name: Disable and stop the nftables service
      ansible.builtin.systemd:
        name: nftables
        enabled: false
        state: stopped

    - name: Mask the nftables service
      ansible.builtin.systemd:
        name: nftables
        masked: true

    # 手册 2.4
    - name: Check swap status
      ansible.builtin.command:
        cmd: swapon --show
      register: os_swapon
      changed_when: false
      check_mode: false

    - name: Disable swap
      ansible.builtin.command:
        cmd: swapoff -a
      when: os_swapon.stdout | trim != ''
      changed_when: os_swapon.stdout | trim != ''

    # 手册 2.4：注释掉所有 swap 条目（不只是 /swap.img——UUID 或其他路径的 swap
    # 同样会导致重启后 swap 复活）。swap 是第 3 个字段，按字段结构匹配，
    # 不会误伤行尾注释里带 swap 字样的数据盘条目；已注释行跳过（幂等）。
    # 空白类必须用 [ \t] 而非 \s：\s 含换行，会把匹配拉到上一行，
    # 注释掉空行而漏掉 swap 行本身（决策 #40 修复）
    - name: Comment out every swap entry in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?![ \t]*#)([ \t]*\S+[ \t]+\S+[ \t]+swap[ \t].*)$'
        replace: '#\1'

    # 手册 2.6（决策 #46，勘误见下）：无条件保证服务处于 started+enabled。
    # 原判据"/run/.../resolv.conf 存在才装"把"没装"与"装了没起"混为一谈；
    # resolved 不 active 时 kubeadm 不会把 kubelet 的 resolvConf 指向 /run
    # 上游文件，CoreDNS 会读到 127.0.0.53 stub 回环。
    # 勘误：不装包（手册 2.6 的 apt 行本就是注释掉的备选）——24.04 的
    # resolved 随基础系统就位（实测 cqjf/test 节点均在跑），要防的只有
    # "装了没起"；而 apt 任务在索引不含该包名的节点（test 实测，离线/
    # 受限镜像）必炸——装包引入了本不存在的故障面。started 拉起时自动
    # 重生成 /run 文件，无需 restart handler
    - name: Ensure systemd-resolved is started and enabled
      ansible.builtin.systemd:
        name: systemd-resolved
        state: started
        enabled: true

    # 手册 2.7：自动卸载 timesyncd 属预期
    - name: Install chrony
      ansible.builtin.apt:
        name: chrony
        state: present

    # 手册 2.7：仅 server 行，不配 allow/local
    - name: Write the chrony configuration
      ansible.builtin.template:
        src: chrony.conf.j2
        dest: /etc/chrony/chrony.conf
        mode: "0644"
      notify: Restart chrony

    # 手册 2.8：原装 Ubuntu 24.04 不带 /etc/systemd/journald.conf.d（dpkg 只装
    # /usr/lib 下 vendor 目录，实测），template 不建父目录——先确保目录存在
    - name: Ensure the journald drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    # 手册 2.8
    - name: Write the journald size limit
      ansible.builtin.template:
        src: journald.conf.j2
        dest: /etc/systemd/journald.conf.d/10-k8s-node.conf
        mode: "0644"
      notify: Restart journald

    # 验证前先让 chrony/journald 等服务重启完，读到的是终态
    - name: Flush handlers before verification
      ansible.builtin.meta: flush_handlers

    # 手册 2.7
    - name: Enable chrony on boot
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: started
