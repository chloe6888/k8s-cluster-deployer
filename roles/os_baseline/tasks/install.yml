---
# 阶段 10：系统基线（手册 2.1–2.4、2.6–2.8），全部节点并行。幂等要求：第二次运行 changed=0。
- name: Apply the OS baseline
  tags: [os]
  block:
    # 手册 2.1
    - name: Set the hostname
      ansible.builtin.hostname:
        name: "{{ node_name }}"

    # 手册 2.1：受管区块写入全部节点的 内网IP 节点名
    - name: Write the managed /etc/hosts block (all nodes, internal IP, node name)
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} k8s-cluster-deployer managed"
        block: "{{ hosts_lines }}"
      vars:
        hosts_lines: >-
          {{ groups['k8s_all'] | map('extract', hostvars, 'node_ip')
             | zip(groups['k8s_all'] | map('extract', hostvars, 'node_name'))
             | map('join', ' ') | join('\n') }}

    # 手册 2.1：/etc/hosts 写完立刻确认 Harbor 域名可解析
    - name: Verify Harbor hostname resolution
      ansible.builtin.command:
        cmd: getent hosts {{ harbor.split(':')[0] }}
      register: os_harbor_check
      changed_when: false
      failed_when: os_harbor_check.rc != 0
      check_mode: false

    # 手册 2.2
    - name: Persist the k8s.conf module list (overlay / br_netfilter / ipip)
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter
          ipip
      notify: Reload kernel modules

    # 手册 2.3
    - name: Persist the nftables.conf module list (nf_tables / nf_nat / nf_conntrack)
      ansible.builtin.copy:
        dest: /etc/modules-load.d/nftables.conf
        mode: "0644"
        content: |
          nf_tables
          nf_nat
          nf_conntrack
      notify: Reload kernel modules

    # 手册 2.2/2.3：立即加载，不等重启
    - name: Load kernel modules immediately
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: [overlay, br_netfilter, ipip, nf_tables, nf_nat, nf_conntrack]

    # 手册 2.2：rp_filter 显式写入，防加固基线把 2 改回 1，勿因与默认重复而删除
    - name: Write the nine sysctl parameters
      ansible.builtin.template:
        src: k8s-sysctl.conf.j2
        dest: /etc/sysctl.d/k8s.conf
        mode: "0644"
      register: os_sysctl_file

    # 手册 2.2：必须立即生效（后续 kubelet 依赖），不能延迟到 handler，故不用 no-handler 写法
    - name: Apply sysctl via sysctl --system
      ansible.builtin.command:
        cmd: sysctl --system
      when: os_sysctl_file is changed
      changed_when: os_sysctl_file is changed

    # 手册 2.3：只用 CLI，不用服务（服务起来会 flush ruleset）
    - name: Install the nftables CLI tools
      ansible.builtin.apt:
        name: nftables
        state: present
        update_cache: false

    - name: Disable nftables service autostart
      ansible.builtin.systemd:
        name: nftables
        enabled: false

    # mask 后 start/stop/reload 均被 systemd 拒绝，彻底杜绝误启
    - name: Mask the nftables service
      ansible.builtin.systemd:
        name: nftables
        masked: true

    # 手册 2.3：默认不做；新装集群节点上空闲的 nftables 服务才考虑停掉
    - name: Optionally stop the idle nftables service
      when: nftables_stop_if_idle | bool
      block:
        - name: Read nftables service state and ruleset
          ansible.builtin.command:
            cmd: "{{ item }}"
          loop:
            - systemctl is-active nftables
            - nft list ruleset
          register: os_nft_idle_probe
          changed_when: false
          check_mode: false

        # 未加入集群（无 tunl0）+ 规则集为空 + 服务 active 三个条件都满足才停
        - name: Stop only when not clustered, ruleset empty, and service active
          ansible.builtin.systemd:
            name: nftables
            state: stopped
          when:
            - not (ansible_interfaces | default([]) | intersect(['tunl0']))
            - os_nft_idle_probe.results[0].stdout == 'active'
            - os_nft_idle_probe.results[1].stdout | trim == ''

    # 手册 2.4
    - name: Check swap status
      ansible.builtin.command:
        cmd: swapon --show
      register: os_swapon
      changed_when: false
      check_mode: false

    - name: Disable swap
      ansible.builtin.command:
        cmd: swapoff -a
      when: os_swapon.stdout | trim != ''
      changed_when: os_swapon.stdout | trim != ''

    # 手册 2.4：注释掉所有 swap 条目（不只是 /swap.img——UUID 或其他路径的 swap
    # 同样会导致重启后 swap 复活）。swap 是第 3 个字段，按字段结构匹配，
    # 不会误伤行尾注释里带 swap 字样的数据盘条目；已注释行跳过（幂等）
    - name: Comment out every swap entry in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!\s*#)(\s*\S+\s+\S+\s+swap\s.*)$'
        replace: '#\1'

    # 手册 2.6
    - name: Check systemd-resolved upstream files
      ansible.builtin.stat:
        path: /run/systemd/resolve/resolv.conf
      register: os_resolv_conf

    - name: Install and start systemd-resolved when missing
      when: not os_resolv_conf.stat.exists
      ansible.builtin.apt:
        name: systemd-resolved
        state: present
      notify: Restart systemd-resolved

    # 手册 2.7：自动卸载 timesyncd 属预期
    - name: Install chrony
      ansible.builtin.apt:
        name: chrony
        state: present

    # 手册 2.7：仅 server 行，不配 allow/local
    - name: Write the chrony configuration
      ansible.builtin.template:
        src: chrony.conf.j2
        dest: /etc/chrony/chrony.conf
        mode: "0644"
      notify: Restart chrony

    # 手册 2.8
    - name: Write the journald size limit
      ansible.builtin.template:
        src: journald.conf.j2
        dest: /etc/systemd/journald.conf.d/10-k8s-node.conf
        mode: "0644"
      notify: Restart journald

    # 验证前先让 chrony/journald 等服务重启完，读到的是终态
    - name: Flush handlers before verification
      ansible.builtin.meta: flush_handlers

    # 手册 2.7
    - name: Enable chrony on boot
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: started
