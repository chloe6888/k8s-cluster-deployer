---
# 决策 #51：TLS 证书剩余有效期门禁（天）。证书不足 N 天到期即中止 gateway 阶段，
# 提前于客户端 HTTPS 报错；设 0 则只拦已过期。集群可在 group_vars 覆盖
gw_tls_min_valid_days: 30

# 决策 #52：资源对象名单一事实源——三个模板与 install.yml 里的 kubectl 命令都从这里取。
# 生产命名弃用缩写（eg/proxy-ext/gw-ext），但避开 chart 自有对象：ClusterRole/Deployment/
# Service/ServiceAccount 均名为 envoy-gateway（ClusterRole 还是集群级），RBAC 为
# eg-gateway-helm-* 前缀，helm release 名 eg 也不改（release 名会拼进 RBAC 对象名）。
# MetalLB 池名 pool-ext 不属于本 role 边界，未一并改名。集群可在 group_vars 覆盖
gw_gatewayclass_name: envoy-gateway-external
gw_envoyproxy_name: envoy-proxy-external
gw_gateway_name: gateway-external
# 本就非缩写，仅纳入单一事实源供模板与清理任务共用
gw_redirect_route_name: http-to-https
