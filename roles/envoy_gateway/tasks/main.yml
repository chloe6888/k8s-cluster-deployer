---
# 阶段 81：Envoy Gateway 1.7.1（手册第 8 章，只跑在 master01；修订 9：Gateway 监听 443）。
# 证书走 vault → /dev/shm 临时文件 → Secret，用后必删（always）。
- name: 确认在 master01 执行
  ansible.builtin.assert:
    that: inventory_hostname == groups['masters'][0]

- name: "8.1 获取 Envoy Gateway Chart（获取即校验）"
  ansible.builtin.include_role:
    name: artifact
  vars:
    artifact_file: "gateway-helm-v{{ envoy_gateway_version }}.tgz"
  tags: [gateway]

- name: "8.1 渲染 values（global.imageRegistry 覆盖控制面与 certgen）"
  ansible.builtin.copy:
    dest: "{{ package_dir }}/charts/envoy-gateway-values.yaml"
    mode: "0644"
    content: |
      global:
        imageRegistry: {{ registry }}
  tags: [gateway]

- name: "8.1 核对渲染镜像全部指向 {{ registry }}"
  ansible.builtin.shell: >-
    helm template eg {{ package_dir }}/charts/gateway-helm-v{{ envoy_gateway_version }}.tgz
    -n envoy-gateway-system -f {{ package_dir }}/charts/envoy-gateway-values.yaml
    | grep -E 'image:' | sort -u
  args:
    executable: /bin/bash
  register: gw_images
  changed_when: false
  failed_when: >-
    gw_images.stdout_lines | length == 0
    or (gw_images.stdout_lines | reject('search', registry | regex_escape) | list | length) > 0
  tags: [gateway]

- name: "8.2 helm upgrade --install eg（--create-namespace）"
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install eg {{ package_dir }}/charts/gateway-helm-v{{ envoy_gateway_version }}.tgz
      --namespace envoy-gateway-system --create-namespace
      -f {{ package_dir }}/charts/envoy-gateway-values.yaml
  register: gw_install
  changed_when: "'has been upgraded' in gw_install.stdout or 'deployed' in gw_install.stdout"
  tags: [gateway]

- name: "8.2 等待 envoy-gateway 控制面就绪"
  ansible.builtin.command:
    cmd: kubectl wait --timeout=5m -n envoy-gateway-system deployment/envoy-gateway --for=condition=Available
  changed_when: false
  tags: [gateway, verify]

- name: "8.2 确认 Gateway API CRD 存在（缺失则 8.3 apply 失败）"
  ansible.builtin.command:
    cmd: kubectl get crd gatewayclasses.gateway.networking.k8s.io gateways.gateway.networking.k8s.io
  register: gw_crd
  changed_when: false
  failed_when: gw_crd.rc != 0
  tags: [gateway]

# ---- 8.3 EnvoyProxy + GatewayClass ----
- name: "8.3 渲染并应用 EnvoyProxy / GatewayClass"
  ansible.builtin.template:
    src: envoy-gatewayclass.yaml.j2
    dest: "{{ package_dir }}/charts/envoy-gatewayclass.yaml"
    mode: "0644"
  tags: [gateway]

- name: "8.3 应用 EnvoyProxy / GatewayClass"
  ansible.builtin.command:
    cmd: kubectl apply -f {{ package_dir }}/charts/envoy-gatewayclass.yaml
  register: gw_gc_apply
  changed_when: "'created' in gw_gc_apply.stdout or 'configured' in gw_gc_apply.stdout"
  tags: [gateway]

- name: "8.3 确认 GatewayClass eg 就绪"
  ansible.builtin.command:
    cmd: kubectl get gatewayclass eg
  register: gw_gc
  changed_when: false
  failed_when: gw_gc.stdout is not search('True')
  tags: [gateway, verify]

# ---- 8.4① TLS Secret（vault 证书 → /dev/shm，用后必删）----
- name: "8.4① TLS Secret（gw_tls_cert 非空才启用 443）"
  when: gw_tls_enabled | bool
  block:
    - name: 证书与私钥落到 /dev/shm（tmpfs，不落盘）
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        mode: "0600"
      no_log: true
      loop:
        - { dest: /dev/shm/gw-tls.crt, content: "{{ gw_tls_cert }}" }
        - { dest: /dev/shm/gw-tls.key, content: "{{ gw_tls_key }}" }

    - name: 核对证书与私钥匹配（两条哈希应一致）与证书信息
      ansible.builtin.shell: >-
        set -e;
        openssl x509 -in /dev/shm/gw-tls.crt -noout -subject -enddate -ext subjectAltName;
        test "$(openssl x509 -in /dev/shm/gw-tls.crt -noout -pubkey | sha256sum | awk '{print $1}')"
          = "$(openssl pkey -in /dev/shm/gw-tls.key -pubout | sha256sum | awk '{print $1}')"
      args:
        executable: /bin/bash
      changed_when: false

    - name: 创建 / 更新 kubernetes.io/tls Secret
      ansible.builtin.shell: >-
        kubectl -n envoy-gateway-system create secret tls {{ gw_tls_secret }}
        --cert=/dev/shm/gw-tls.crt --key=/dev/shm/gw-tls.key
        --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      no_log: true
      register: gw_secret
      changed_when: "'created' in gw_secret.stdout or 'configured' in gw_secret.stdout"

  always:
    - name: 删除 /dev/shm 临时证书（必删）
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/dev/shm/gw-tls.crt, /dev/shm/gw-tls.key]
  tags: [gateway]

# ---- 8.4② Gateway（80 常开；443 仅 TLS 启用时；修订 9）----
- name: "8.4② 渲染并应用 Gateway"
  ansible.builtin.template:
    src: envoy-gateway.yaml.j2
    dest: "{{ package_dir }}/charts/envoy-gateway.yaml"
    mode: "0644"
  tags: [gateway]

- name: "8.4② 应用 Gateway"
  ansible.builtin.command:
    cmd: kubectl apply -f {{ package_dir }}/charts/envoy-gateway.yaml
  register: gw_apply
  changed_when: "'created' in gw_apply.stdout or 'configured' in gw_apply.stdout"
  tags: [gateway]

# ---- 8.4③ 可选：80→443 跳转 ----
- name: "8.4③ HTTP→HTTPS 301 跳转（gw_http_redirect=true 才创建）"
  when: (gw_http_redirect | bool) and (gw_tls_enabled | bool)
  block:
    - name: 渲染 http-redirect
      ansible.builtin.template:
        src: http-redirect.yaml.j2
        dest: "{{ package_dir }}/charts/http-redirect.yaml"
        mode: "0644"

    - name: 应用 http-redirect（会接管 80 上未匹配流量）
      ansible.builtin.command:
        cmd: kubectl apply -f {{ package_dir }}/charts/http-redirect.yaml
      register: gw_redirect
      changed_when: "'created' in gw_redirect.stdout or 'configured' in gw_redirect.stdout"

- name: "8.4③ 跳转未启用时删除遗留 http-to-https"
  when: not ((gw_http_redirect | bool) and (gw_tls_enabled | bool))
  ansible.builtin.command:
    cmd: kubectl -n envoy-gateway-system delete httproute http-to-https --ignore-not-found
  register: gw_redirect_del
  changed_when: "'deleted' in gw_redirect_del.stdout"
  tags: [gateway]

# ---- 8.4④ 验证 ----
- name: "8.4④ 等待 Gateway Programmed"
  ansible.builtin.command:
    cmd: kubectl -n envoy-gateway-system wait --for=condition=Programmed gateway/gw-ext --timeout=5m
  changed_when: false
  tags: [gateway, verify]

- name: "8.4④ Envoy Service 应分到 {{ gw_ext_ip }}"
  ansible.builtin.shell: >-
    kubectl get svc -n envoy-gateway-system -o json
    | grep -o '"loadBalancerIP": *"[^"]*"\|"ip": *"{{ gw_ext_ip }}"'
  args:
    executable: /bin/bash
  register: gw_svc_ip
  changed_when: false
  failed_when: gw_svc_ip.stdout is not search(gw_ext_ip | regex_escape)
  tags: [gateway, verify]

- name: "8.4④ 数据面镜像复核（envoy Deployment 各容器均指向 {{ registry }}）"
  ansible.builtin.shell: >-
    kubectl -n envoy-gateway-system get deploy -o jsonpath='{.items[*].spec.template.spec.containers[*].image}'
    | tr ' ' '\n' | sort -u
  args:
    executable: /bin/bash
  register: gw_dp_images
  changed_when: false
  failed_when: >-
    gw_dp_images.stdout_lines | length == 0
    or (gw_dp_images.stdout_lines | reject('search', registry | regex_escape) | list | length) > 0
  tags: [gateway, verify]
