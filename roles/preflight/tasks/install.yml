---
# 节点侧预检（只读为主；apt 缓存刷新是修订 15 的唯一例外，无破坏性）。
# 任何一项失败直接中止并指出节点与变量。
- name: Preflight the cluster nodes
  tags: [os]
  block:
    - name: Check OS and login (Ubuntu 24.04 / amd64 / root)
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('24.04', '==')
          - ansible_architecture == 'x86_64'
          - ansible_user_uid is defined and ansible_user_uid == 0
        fail_msg: >-
          {{ inventory_hostname }}：要求 Ubuntu 24.04 amd64 且以 root 执行
          （实际 {{ ansible_distribution }} {{ ansible_distribution_version }} {{ ansible_architecture }}，uid={{ ansible_user_uid | default('未知') }}）
        quiet: true

    # 决策 #50：预留合计超过节点容量时 kubelet 起不来（validateNodeAllocatable
    # 直接报错，要到 kubeadm 阶段才暴露），预检提前拦。预留值与 init_master 模板
    # 同源（config/versions.yml 的 kube_reserved/system_reserved）；内存另加 512Mi
    # 余量给内核与 eviction 阈值呼吸空间
    - name: Assert the node can cover the reserved cpu and memory
      ansible.builtin.assert:
        that:
          - ansible_processor_vcpus | int >= (kube_reserved.cpu | int) + (system_reserved.cpu | int)
          - ansible_memtotal_mb | int >= (kube_reserved.memory_mb | int) + (system_reserved.memory_mb | int) + 512
        fail_msg: >-
          {{ inventory_hostname }} 容量不足以覆盖 kubelet 预留：要求 ≥{{ (kube_reserved.cpu | int) + (system_reserved.cpu | int) }} 核 /
          ≥{{ (kube_reserved.memory_mb | int) + (system_reserved.memory_mb | int) + 512 }} MiB（预留合计+512Mi 余量），
          实际 {{ ansible_processor_vcpus }} 核 / {{ ansible_memtotal_mb }} MiB。
          调小 config/versions.yml 的 kube_reserved/system_reserved，或换更大的节点
        quiet: true

    # 克隆机的 machine-id / product_uuid 重复会导致 join 异常，必须在动手前拦下
    - name: Read machine-id and product_uuid
      ansible.builtin.command:
        cmd: cat {{ item }}
      loop:
        - /etc/machine-id
        - /sys/class/dmi/id/product_uuid
      register: preflight_ids
      changed_when: false
      check_mode: false

    - name: Record node identity
      ansible.builtin.set_fact:
        node_machine_id: "{{ preflight_ids.results[0].stdout }}"
        node_product_uuid: "{{ preflight_ids.results[1].stdout }}"

    - name: Assert cluster-wide uniqueness (machine-id / product_uuid / node_ip / node_name)
      ansible.builtin.assert:
        that:
          - node_machine_id_list | length == node_machine_id_list | unique | length
          - node_product_uuid_list | length == node_product_uuid_list | unique | length
        fail_msg: >-
          存在重复节点标识（克隆机最常见，会导致 join 异常）：
          machine-id 重复 {{ node_machine_id_list | length - node_machine_id_list | unique | length }} 台、
          product_uuid 重复 {{ node_product_uuid_list | length - node_product_uuid_list | unique | length }} 台。
          逐台核对：{{ dict(node_name_list | zip(node_machine_id_list)) }}
        quiet: true
      vars:
        # 决策 #50：用 ansible_play_hosts 而非 groups['k8s_all']——--limit 运行时，
        # 不在本次 play 里的主机从未执行上面的 set_fact，extract 其变量直接报
        # 'HostVarsVars' has no attribute（实测复现）。本次实际执行的主机全部
        # 已设值；全量运行时两者等价，唯一性语义不削弱
        node_machine_id_list: "{{ ansible_play_hosts | map('extract', hostvars, 'node_machine_id') | list }}"
        node_product_uuid_list: "{{ ansible_play_hosts | map('extract', hostvars, 'node_product_uuid') | list }}"
        node_name_list: "{{ ansible_play_hosts | map('extract', hostvars, 'node_name') | list }}"
      run_once: true

    # 循环的 failed_when 在每次迭代求值，拿到的是当次结果（无 .results 聚合，
    # 引用 results[idx] 会直接报错——决策 #42 修复），直接读当前迭代即可
    - name: Check required interfaces (node_iface / ext_iface)
      ansible.builtin.stat:
        path: /sys/class/net/{{ item }}
      loop:
        - "{{ node_iface }}"
        - "{{ ext_iface }}"
      register: preflight_ifaces
      failed_when: not preflight_ifaces.stat.exists
      loop_control:
        label: "{{ item }}"

    - name: Check node_ip is bound to the internal interface
      ansible.builtin.command:
        cmd: ip -4 -o addr show dev {{ node_iface }} scope global
      register: preflight_addr
      changed_when: false
      failed_when: preflight_addr.stdout is not search(node_ip ~ '/')
      check_mode: false

    - name: Check the default route is single and on the external interface
      ansible.builtin.command:
        cmd: ip -4 route show default
      register: preflight_default_route
      changed_when: false
      failed_when: >-
        preflight_default_route.stdout_lines | length != 1
        or preflight_default_route.stdout is not search('dev ' ~ ext_iface)
      check_mode: false

    - name: Check the Harbor hostname resolves
      ansible.builtin.command:
        cmd: getent ahostsv4 {{ harbor.split(':')[0] }}
      register: preflight_harbor_resolv
      changed_when: false
      failed_when: preflight_harbor_resolv.rc != 0 or preflight_harbor_resolv.stdout | length == 0
      check_mode: false

    - name: Check Harbor traffic uses the internal interface (dev node_iface, src node_ip)
      ansible.builtin.command:
        cmd: ip route get {{ preflight_harbor_ip }}
      vars:
        preflight_harbor_ip: "{{ preflight_harbor_resolv.stdout.split()[0] }}"
      register: preflight_harbor_route
      changed_when: false
      failed_when: >-
        preflight_harbor_route.stdout is not search('dev ' ~ node_iface)
        or preflight_harbor_route.stdout is not search('src ' ~ node_ip)
      check_mode: false

    - name: Check VIP subnet membership (internal VIP in node_cidr, external VIP in node subnet)
      ansible.builtin.script: check_vip.py
      args:
        executable: /usr/bin/env python3
      environment:
        K8S_VARS: >-
          {{ { 'vip': vip, 'node_cidr': node_cidr,
               'ext_vip': ext_vip, 'ext_vip_prefix': ext_vip_prefix | default(24),
               'node_ext_ip': node_ext_ip } | to_json }}
      changed_when: false
      check_mode: false

    # 已装 Calico 的判据（决策 #42 修复）：查 kubelet/CNI 配置目录，不用 tunl0——
    # os_baseline 阶段 10 就会 modprobe ipip（Calico IPIP 依赖），tunl0 随之创建，
    # 之后重跑 preflight 时 VIP/CIDR 探测会被静默跳过；配置目录只有装过 k8s 才有
    - name: Detect an existing CNI configuration
      ansible.builtin.stat:
        path: /etc/cni/net.d
      register: preflight_cni_dir
      changed_when: false
      check_mode: false

    # 决策 #50：HA 层已存在（任一 master 的 keepalived 活跃）时 VIP 本就在本集群
    # 某台 master 上，ping 必应答——reset 后（cni 已删、keepalived 默认保留）与
    # 阶段 20-50 窗口（HA 已铺、Calico 未装）重跑都会误报"被其他主机占用"。
    # 探测从控制机逐台委托执行，旗标 run_once 广播到批内全部主机（含 worker，
    # 它们的 ping 同样会被合法持有者应答）。未铺 HA 时全部 inactive → 旗标为假
    - name: Detect whether keepalived is active on any master
      ansible.builtin.command:
        cmd: systemctl is-active keepalived
      loop: "{{ groups['masters'] }}"
      loop_control:
        label: "{{ item }}"
      delegate_to: "{{ item }}"
      run_once: true
      register: preflight_keepalived_probe
      changed_when: false
      failed_when: false
      # 整机不可达（关机/尚未部署）不让探测炸掉重跑：无 stdout 的结果
      # 在下面的 selectattr 里自然被过滤掉
      ignore_unreachable: true
      check_mode: false

    - name: Record whether the HA layer is already active
      ansible.builtin.set_fact:
        preflight_ha_active: >-
          {{ preflight_keepalived_probe.results
             | selectattr('stdout', 'defined')
             | selectattr('stdout', 'equalto', 'active') | list | length > 0 }}
      run_once: true

    # VIP 已被占用时 keepalived 起来会脑裂/抢主，动手前从每个节点探一次；
    # 已装 Calico（/etc/cni/net.d）或 HA 层已活跃的节点跳过——后者 VIP 在本集群
    # 某台 master 上属预期应答，前者有 Pod 路由探测必误报
    - name: Ping both VIPs to detect squatters
      ansible.builtin.command:
        cmd: ping -c 1 -W 2 {{ item }}
      loop:
        - "{{ vip }}"
        - "{{ ext_vip }}"
      register: preflight_vip_ping
      failed_when: false
      changed_when: false
      check_mode: false
      when:
        - not preflight_cni_dir.stat.exists
        - not (preflight_ha_active | bool)

    - name: Assert neither VIP answers
      ansible.builtin.assert:
        that: item.rc != 0
        fail_msg: >-
          {{ inventory_hostname }} 上 ping {{ item.item }} 有响应：该 VIP 已被其他主机占用，
          keepalived 启用后会脑裂/抢主。排查：arping -I {{ node_iface }} {{ item.item }}
        quiet: true
      loop: "{{ preflight_vip_ping.results | default([]) | selectattr('rc', 'defined') | list }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - not preflight_cni_dir.stat.exists
        - not (preflight_ha_active | bool)

    # 手册 1.4：已装 Calico 的节点跳过，避免 Pod 路由误报（同一豁免）
    - name: Check CIDR conflicts
      ansible.builtin.script: check_overlap.py
      args:
        executable: /usr/bin/env python3
      environment:
        K8S_VARS: >-
          {{ { 'pod_cidr': pod_cidr, 'service_cidr': service_cidr,
               'node_cidr': node_cidr, 'extra_nets': extra_nets | default([]) } | to_json }}
      when: not preflight_cni_dir.stat.exists
      changed_when: false
      check_mode: false

    # 修订 15：提前暴露内网镜像站缺包；刷新缓存无破坏性，预演也要跑
    - name: Refresh the apt cache
      ansible.builtin.command:
        cmd: apt-get update
      changed_when: false
      check_mode: false

    - name: Check package candidate versions (haproxy/keepalived/socat/chrony/nftables/gnupg)
      ansible.builtin.command:
        cmd: apt-cache policy {{ item }}
      loop: [haproxy, keepalived, socat, chrony, nftables, gnupg]
      register: preflight_apt
      changed_when: false
      # 同上：读当前迭代（决策 #42 修复）
      failed_when: preflight_apt.stdout is search('Candidate:[ ]+\\(none\\)')
      loop_control:
        label: "{{ item }}"
      check_mode: false
