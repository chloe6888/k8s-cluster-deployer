---
# k8s-master02/03 加入控制面。kubectl/etcd 核对统一 delegate 到 k8s-master01。
- name: Join the control plane
  tags: [kubeadm]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  module_defaults:
    ansible.builtin.shell:
      executable: /bin/bash
  block:
    # kubelet.conf 存在即已加入，整段跳过
    - name: Skip when already joined (kubelet.conf exists)
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: jm_joined

    - name: Join the control plane
      when: not jm_joined.stat.exists
      block:
        # ---- 在 master01 现场生成本节点专用凭据 ----
        # 1h TTL；输出即凭据，no_log
        - name: Create a fresh bootstrap token
          ansible.builtin.command:
            cmd: kubeadm token create --ttl 1h
          delegate_to: "{{ groups['masters'][0] }}"
          register: jm_token
          changed_when: false
          no_log: true

        # discovery-token-ca-cert-hash
        - name: Compute the CA public key hash
          ansible.builtin.shell:
            cmd: >-
              openssl x509 -in /etc/kubernetes/pki/ca.crt -pubkey -noout
              | openssl rsa -pubin -outform DER 2>/dev/null | sha256sum | awk '{print $1}'
          delegate_to: "{{ groups['masters'][0] }}"
          register: jm_ca_hash
          changed_when: false

        # 输出含 certificate-key，no_log
        - name: Re-upload control-plane certificates
          ansible.builtin.command:
            cmd: kubeadm init phase upload-certs --upload-certs
          delegate_to: "{{ groups['masters'][0] }}"
          register: jm_upload
          changed_when: false
          no_log: true

        # 文件含 certificate-key，渲染本身 no_log
        - name: Render this node's join configuration
          ansible.builtin.template:
            src: kubeadm-join-controlplane.yml.j2
            dest: /etc/kubeadm/kubeadm-join-controlplane.yml
            mode: "0600"
          no_log: true

        # 渲染后先让 kubeadm 校验 v1beta4 JoinConfiguration，避免错误配置进入实际 join。
        - name: Validate the control-plane join configuration
          ansible.builtin.command:
            cmd: kubeadm config validate --config /etc/kubeadm/kubeadm-join-controlplane.yml
          changed_when: false
          check_mode: false

        # 幂等由 kubelet.conf 存在性把关；命令行只引用配置文件、不含 token，
        # 输出也不打印凭据，所以不加 no_log，失败时能直接看到 kubeadm 的报错
        - name: Run kubeadm join --control-plane
          ansible.builtin.command:
            cmd: kubeadm join --config /etc/kubeadm/kubeadm-join-controlplane.yml
          args:
            creates: /etc/kubernetes/kubelet.conf

        - name: Report join completion
          ansible.builtin.debug:
            msg: "{{ node_name }} 已作为控制面节点加入（advertise {{ node_ip }}:6443）"

      rescue:
        - name: Advise on join failure
          ansible.builtin.fail:
            msg: >-
              {{ node_name }} join 失败（kubeadm 的报错见上一条任务输出）。
              排查：journalctl -u kubelet -e 、crictl ps -a、master01 上 kubectl get pods -n kube-system。
              修复后重跑 join-masters.yml（幂等，已完成节点自动跳过）。

      # 手册 7：含 token / certificate-key 的配置文件无论成功失败都要删除
      always:
        - name: Remove the join configuration containing the key
          ansible.builtin.file:
            path: /etc/kubeadm/kubeadm-join-controlplane.yml
            state: absent

    - name: Prepare the root kubeconfig
      block:
        - name: Create /root/.kube
          ansible.builtin.file:
            path: /root/.kube
            state: directory
            mode: "0700"

        - name: Install admin.conf as /root/.kube/config
          ansible.builtin.copy:
            src: /etc/kubernetes/admin.conf
            dest: /root/.kube/config
            mode: "0600"
            remote_src: true

    # 门禁（流程内等待，不打 verify）：4 个 static pod Running 才放行下一台
    - name: Wait for the four static pods to be Running
      ansible.builtin.command:
        cmd: >-
          kubectl -n kube-system get pods --field-selector spec.nodeName={{ node_name }}
          -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.phase}{"\n"}{end}'
      delegate_to: "{{ groups['masters'][0] }}"
      register: jm_static_pods
      until:
        - jm_static_pods.stdout is search('etcd-' ~ node_name ~ '\s+Running')
        - jm_static_pods.stdout is search('kube-apiserver-' ~ node_name ~ '\s+Running')
        - jm_static_pods.stdout is search('kube-controller-manager-' ~ node_name ~ '\s+Running')
        - jm_static_pods.stdout is search('kube-scheduler-' ~ node_name ~ '\s+Running')
      retries: 30
      delay: 10
      changed_when: false
      check_mode: false
