---
# 只读核对 etcd 健康与节点状态（NotReady 属预期，装完 Calico 才 Ready）。
- name: Verify master01 initialization
  tags: [kubeadm, verify]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  module_defaults:
    ansible.builtin.shell:
      executable: /bin/bash
  block:
    # etcdctl endpoint health（在 etcd 容器内执行）
    - name: Check etcd health
      ansible.builtin.shell:
        cmd: >-
          crictl exec "$(crictl ps --name etcd -q | head -n1)"
          etcdctl --endpoints=https://127.0.0.1:2379
          --cacert=/etc/kubernetes/pki/etcd/ca.crt
          --cert=/etc/kubernetes/pki/etcd/server.crt
          --key=/etc/kubernetes/pki/etcd/server.key
          endpoint health
      register: init_etcd_health
      changed_when: false
      failed_when: init_etcd_health.stdout is not search('is healthy[:] successfully')
      check_mode: false

    - name: Show node status
      ansible.builtin.command:
        cmd: kubectl get nodes -o wide
      register: init_nodes
      changed_when: false
      check_mode: false

    - name: Print node status
      ansible.builtin.debug:
        var: init_nodes.stdout_lines
