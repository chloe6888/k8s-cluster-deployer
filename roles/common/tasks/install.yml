---
# 公共前置：节点名确认 + host_vars 显式性断言。所有 --tags 选择下都必须先执行，故打 always。
- name: Prepare the common node facts
  tags: [always]
  block:
    # 节点名 = inventory 主机名（决策 #44）。主机名在节点创建阶段已配置好，本工程不代改
    - name: Compute the node name
      ansible.builtin.set_fact:
        node_name: "{{ inventory_hostname }}"

    # 决策 #50：reset.yml 等独立 playbook 用 gather_facts: false，主机名断言需要
    # min facts（ansible_hostname）。常规 play 已收集过则跳过，无额外开销；
    # 缺了这一步，单独执行 reset 必报 'ansible_hostname' is undefined
    - name: Gather minimum facts when the play skipped fact collection
      when: ansible_hostname is not defined
      ansible.builtin.setup:
        gather_subset: min

    # 决策 #44：不再代改主机名，改为一致性门禁——系统 hostname 与 inventory 不符时
    # kubelet 的注册名会和 kubeadm nodeRegistration.name 分叉，这里尽早拦下让用户二选一修正
    - name: Assert the system hostname matches the inventory name
      ansible.builtin.assert:
        that: ansible_hostname == inventory_hostname
        fail_msg: >-
          {{ inventory_hostname }} 的系统主机名是 {{ ansible_hostname }}，与 inventory 不一致。
          本工程不代改主机名（节点创建阶段已配置）：改 inventory 主机名，
          或在节点上执行 hostnamectl set-hostname {{ inventory_hostname }}，二选一后重跑。
        quiet: true

    # 不用 ansible_default_ipv4：默认路由在外网网卡，会取到外网 IP
    - name: Assert node vars are explicitly set in host_vars
      ansible.builtin.assert:
        that:
          - node_ip is defined and node_ip != ''
          - node_ext_ip is defined and node_ext_ip != ''
        fail_msg: >-
          {{ inventory_hostname }} 缺少 node_ip / node_ext_ip：必须显式写入 host_vars，
          不要用 ansible_default_ipv4（默认路由在外网网卡，会取到外网 IP）。
        quiet: true
