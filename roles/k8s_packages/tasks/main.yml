---
# 阶段 40：kubelet / kubeadm / kubectl / crictl（手册 5.1、5.2）。全部节点并行。
- name: Install gnupg (needed for the Release.key fingerprint check)
  ansible.builtin.apt:
    name: gnupg
    state: present
    update_cache: false
  tags: [kubeadm]

- name: Fetch Release.key (verified on fetch)  # 手册 5.1
  ansible.builtin.include_role:
    name: artifact
  vars:
    artifact_file: Release.key
  tags: [kubeadm]

- name: Verify the Release.key sha256 against the registered value  # 手册 5.1
  ansible.builtin.command:
    cmd: "sha256sum {{ package_dir }}/Release.key"
  register: pkg_key_sha
  changed_when: false
  failed_when: k8s_release_key_sha256 | default('') != '' and pkg_key_sha.stdout.split()[0] != k8s_release_key_sha256
  tags: [kubeadm]

- name: Warn that no Release.key checksum is registered  # 手册 5.1
  ansible.builtin.debug:
    msg: >-
      警告：k8s_release_key_sha256 / k8s_release_key_fingerprint 未填写，跳过指纹核对。
      公钥可信度只依赖内网镜像站，请在 group_vars 登记后重跑阶段 40。
  when: (k8s_release_key_sha256 | default('')) == '' or (k8s_release_key_fingerprint | default('')) == ''
  tags: [kubeadm]

- name: Verify the GPG fingerprint (mismatch aborts)  # 手册 5.1
  ansible.builtin.command:
    cmd: "gpg --show-keys --fingerprint {{ package_dir }}/Release.key"
  register: pkg_key_fp
  changed_when: false
  failed_when: >-
    k8s_release_key_fingerprint | default('') != ''
    and (pkg_key_fp.stdout | replace(' ', '') is not search(k8s_release_key_fingerprint | replace(' ', '')))
  tags: [kubeadm]

- name: Convert the key to an apt keyring  # 手册 5.1
  ansible.builtin.command:
    cmd: "gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg {{ package_dir }}/Release.key"
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  tags: [kubeadm]

- name: Set keyring permissions to 0644  # 手册 5.1
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    mode: "0644"

- name: Write the apt source  # 手册 5.1
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    mode: "0644"
    content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] {{ apt_k8s_url }} /\n"
  tags: [kubeadm]

- name: Run apt update  # 手册 5.1
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 600
  tags: [kubeadm]

- name: "Verify the kubeadm candidate version and origin are {{ kubernetes_version }}"  # 手册 5.1
  ansible.builtin.command:
    cmd: apt-cache policy kubeadm
  register: pkg_kubeadm_policy
  changed_when: false
  failed_when: >-
    pkg_kubeadm_policy.stdout is not search('Candidate: ' ~ kubernetes_version)
    or pkg_kubeadm_policy.stdout is not search((apt_k8s_url | urlsplit('hostname')) | regex_escape)
  tags: [kubeadm]

- name: Install the pinned kubelet / kubeadm / kubectl  # 手册 5.1
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
      - "kubeadm={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
      - "kubectl={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
    state: present
    update_cache: false
  tags: [kubeadm]

- name: Hold the three packages  # 手册 5.1
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]
  tags: [kubeadm]

- name: Enable kubelet on boot without starting it  # 手册 5.1
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
  tags: [kubeadm]

- name: Pin the node IP on both NICs before init or join  # 手册 5.1
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    mode: "0644"
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}\n"
  tags: [kubeadm]

- name: Install cri-tools only when crictl is missing  # 手册 5.2
  ansible.builtin.command:
    cmd: crictl --version
  register: pkg_crictl_ver
  failed_when: false
  changed_when: false
  tags: [kubeadm]

- name: Install cri-tools  # 手册 5.2
  ansible.builtin.apt:
    name: cri-tools
    state: present
    update_cache: false
  when: pkg_crictl_ver.rc != 0
  tags: [kubeadm]

- name: Hold cri-tools  # 手册 5.2
  ansible.builtin.dpkg_selections:
    name: cri-tools
    selection: hold
  tags: [kubeadm]

- name: Write /etc/crictl.yaml  # 手册 5.2
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    mode: "0644"
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
      debug: false
  tags: [kubeadm]

# ---- 验证 ----
- name: Verify the kubeadm version
  ansible.builtin.command:
    cmd: kubeadm version -o short
  register: pkg_kubeadm_ver
  changed_when: false
  failed_when: pkg_kubeadm_ver.stdout | trim != 'v' ~ kubernetes_version
  tags: [kubeadm, verify]

- name: Verify the hold list contains all four packages
  ansible.builtin.command:
    cmd: apt-mark showhold
  register: pkg_holds
  changed_when: false
  failed_when: >-
    ['kubelet', 'kubeadm', 'kubectl', 'cri-tools'] | difference(pkg_holds.stdout_lines) | length > 0
  tags: [kubeadm, verify]

- name: Verify crictl info (same namespace as nerdctl -n k8s.io)
  ansible.builtin.command:
    cmd: crictl info
  register: pkg_crictl_info
  changed_when: false
  failed_when: pkg_crictl_info.rc != 0
  tags: [kubeadm, verify]
