---
# 阶段 60：Calico 3.32.2 两件套 Chart（手册第 6 章，只跑在 master01）。
# CRD 必须 server-side apply（客户端 apply 超 last-applied 注解上限）。
- name: Assert this runs on master01
  ansible.builtin.assert:
    that: inventory_hostname == groups['masters'][0]

- name: Create the charts directory
  ansible.builtin.file:
    path: "{{ package_dir }}/charts"
    state: directory
    mode: "0755"
  tags: [cni]

# ---- 6.2/6.3 获取两个 Chart（获取即校验 SHA256SUMS）----
- name: Fetch the tigera-operator and CRD charts  # 手册 6.2
  ansible.builtin.include_role:
    name: artifact
  vars:
    artifact_files:
      - "tigera-operator-v{{ calico_version }}.tgz"
      - "crd.projectcalico.org.v1-v{{ calico_version }}.tgz"
  tags: [cni]

# ---- 6.4 安装前预检：calico/node 镜像内 nft 必须可用（v3.32.0 曾在此崩溃）----
- name: Run the mandatory nft preflight (rc!=0 aborts)  # 手册 6.4；否则 calico-node 反复崩溃
  ansible.builtin.command:
    cmd: >-
      nerdctl -n k8s.io run --rm --privileged --net=host --entrypoint nft
      {{ registry }}/calico/node:v{{ calico_version }} list tables
  changed_when: false
  failed_when: calico_nft_check.rc != 0
  register: calico_nft_check
  tags: [cni]

# ---- 6.3 CRD Chart：server-side apply ----
- name: Render the CRD chart and apply server-side  # 手册 6.3
  ansible.builtin.shell: >-
    helm template calico-crds {{ package_dir }}/charts/crd.projectcalico.org.v1-v{{ calico_version }}.tgz
    | kubectl apply --server-side -f -
  args:
    executable: /bin/bash
  register: calico_crd_apply
  changed_when: "'created' in calico_crd_apply.stdout or 'configured' in calico_crd_apply.stdout"
  tags: [cni]

- name: Create the tigera-operator namespace  # 手册 6.3
  ansible.builtin.shell: >-
    kubectl create namespace tigera-operator --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  register: calico_ns
  changed_when: "'created' in calico_ns.stdout"
  tags: [cni]

# ---- 6.4 values（模板渲染，唯一事实源在 group_vars + versions.yml）----
- name: Render calico-values.yaml  # 手册 6.4
  ansible.builtin.template:
    src: calico-values.yaml.j2
    dest: "{{ package_dir }}/charts/calico-values.yaml"
    mode: "0644"
  tags: [cni]

- name: "Verify all rendered images point at {{ registry }}"  # 手册 6.4
  ansible.builtin.shell: >-
    helm template calico {{ package_dir }}/charts/tigera-operator-v{{ calico_version }}.tgz
    -n tigera-operator -f {{ package_dir }}/charts/calico-values.yaml
    | grep -E 'image:' | sort -u
  args:
    executable: /bin/bash
  register: calico_images
  changed_when: false
  failed_when: >-
    calico_images.stdout_lines | length == 0
    or (calico_images.stdout_lines | reject('search', registry | regex_escape) | list | length) > 0
  tags: [cni]

# ---- 6.5 安装 Operator ----
- name: Run helm upgrade --install calico  # 手册 6.5
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install calico {{ package_dir }}/charts/tigera-operator-v{{ calico_version }}.tgz
      -n tigera-operator -f {{ package_dir }}/charts/calico-values.yaml
  register: calico_install
  changed_when: "'has been upgraded' in calico_install.stdout or 'deployed' in calico_install.stdout"
  tags: [cni]

- name: Wait for tigera-operator to be ready  # 手册 6.5
  ansible.builtin.command:
    cmd: kubectl -n tigera-operator rollout status deployment/tigera-operator --timeout=5m
  changed_when: false
  tags: [cni, verify]

- name: Wait for TigerStatus Ready (all data-plane components healthy)
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Ready tigerstatus/default --timeout=10m
  changed_when: false
  tags: [cni, verify]

- name: Wait for every node to be Ready (calico-node per node)
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Ready nodes --all --timeout=10m
  changed_when: false
  tags: [cni, verify]

- name: Show node and calico-node status
  ansible.builtin.shell: >-
    kubectl get nodes -o wide;
    kubectl -n kube-system get pods -l k8s-app=calico-node -o wide
  args:
    executable: /bin/bash
  register: calico_status
  changed_when: false
  tags: [cni, verify]

- name: Print status
  ansible.builtin.debug:
    msg: "{{ calico_status.stdout_lines }}"
  tags: [cni, verify]
