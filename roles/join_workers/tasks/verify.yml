---
# 只读展示本节点状态（手册 5.9）。
- name: Verify the worker join
  tags: [kubeadm, verify]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  block:
    - name: Show this node's status
      ansible.builtin.command:
        cmd: kubectl get node {{ node_name }} -o wide
      delegate_to: "{{ groups['masters'][0] }}"
      register: jw_node
      changed_when: false
      check_mode: false

    - name: Print node status
      ansible.builtin.debug:
        var: jw_node.stdout_lines
