---
# 阶段 70：worker 分批加入（手册 5.9）。play 层 serial: "{{ worker_batch_size }}"。
# 每批一批专用 token（--ttl 4h，覆盖批次窗口）；批内凭据 no_log。
- name: "Assert this node is not in the masters group"
  ansible.builtin.assert:
    that: inventory_hostname not in groups['masters']
    fail_msg: "join_workers 只对 worker 执行"

- name: "Skip when already joined (kubelet.conf exists)"
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: jw_joined

- name: "Join the cluster"
  when: not jw_joined.stat.exists
  block:
    # ---- calico/node 镜像内 nft 预检（同阶段 60；worker 上 calico-node 同样依赖）----
    - name: "Run the nft preflight (failure stops this worker)"
      ansible.builtin.command:
        cmd: >-
          nerdctl -n k8s.io run --rm --privileged --net=host --entrypoint nft
          {{ registry }}/calico/node:v{{ calico_version }} list tables
      changed_when: false
      failed_when: jw_nft_check.rc != 0
      register: jw_nft_check

    # ---- 批内第一个节点在 master01 生成批专用凭据（run_once；serial 批次天然隔离）----
    - name: "Create the batch token and join command (TTL 4h)"
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command --ttl 4h
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      register: jw_join_cmd
      no_log: true
      changed_when: false

    - name: "Pre-pull business images (failures only warn)"
      ansible.builtin.command:
        cmd: "nerdctl --namespace k8s.io pull {{ item }}"
      loop: "{{ preload_images }}"
      loop_control: { label: "{{ item }}" }
      register: jw_preload
      failed_when: false
      changed_when: false
      when: preload_images | length > 0

    - name: "Report pre-pull failures"
      ansible.builtin.debug:
        msg: "预拉失败（不中止，部署业务前自行补拉）：{{ jw_preload.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"
      when: (jw_preload.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list) | length > 0

    - name: "Run kubeadm join (worker, no_log)"
      ansible.builtin.command:
        cmd: "{{ jw_join_cmd.stdout | trim }} --node-name={{ node_name }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
      no_log: true

    - name: "Report join completion"
      ansible.builtin.debug:
        msg: "{{ node_name }} 已加入集群"

  rescue:
    - name: "Advise on join failure"
      ansible.builtin.fail:
        msg: >-
          {{ node_name }} join 失败（输出已因含凭据被屏蔽）。
          排查：journalctl -u kubelet -e、crictl ps -a、master01 上 kubectl get nodes。
          修复后重跑 join-workers.yml（幂等，已加入节点自动跳过）。

# ---- 批次门禁：本批所有 worker Ready + calico-node Running，才放行下一批 ----
- name: "Wait for this node to be Ready"
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Ready node/{{ node_name }} --timeout=15m
  delegate_to: "{{ groups['masters'][0] }}"
  register: jw_node_ready
  changed_when: false
  tags: [verify]

- name: "Wait for calico-node Running on this node"
  ansible.builtin.command:
    cmd: >-
      kubectl -n kube-system wait --for=container=calico-node
      --field-selector spec.nodeName={{ node_name }} pod -l k8s-app=calico-node --timeout=10m
  delegate_to: "{{ groups['masters'][0] }}"
  register: jw_calico
  changed_when: false
  failed_when: false
  tags: [verify]

- name: "Show pod details when calico-node is not ready"
  ansible.builtin.command:
    cmd: "kubectl -n kube-system get pods -o wide | grep -E '{{ node_name }}|NAME'"
  delegate_to: "{{ groups['masters'][0] }}"
  register: jw_calico_debug
  changed_when: false
  when: jw_calico.rc != 0
  failed_when: true

- name: "Show this node's status"
  ansible.builtin.command:
    cmd: kubectl get node {{ node_name }} -o wide
  delegate_to: "{{ groups['masters'][0] }}"
  register: jw_node
  changed_when: false
  tags: [verify]

- name: "Print node status"
  ansible.builtin.debug:
    msg: "{{ jw_node.stdout_lines }}"
  tags: [verify]
