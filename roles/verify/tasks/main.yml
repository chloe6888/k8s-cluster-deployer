---
# 阶段 90：部署后验收（手册 9.1/9.2）。逐项检查、失败汇总后一次性报告，不逐条中断。
# 危险探测（VIP 漂移、连通性）单独打 never 标签，显式指定才执行。
- name: "Initialize the failure summary"
  ansible.builtin.set_fact:
    verify_failures: []
    verify_node: "{{ node_name }}"
  tags: [verify]

# ===================== 节点级检查（每台节点本机） =====================
- name: "Check the kernel version (only when pin_kernel=true)"  # 手册 9.1
  when: pin_kernel | bool
  block:
    - name: "Read uname -r"
      ansible.builtin.command: uname -r
      register: vf_uname
      changed_when: false

    - name: "Record a kernel mismatch"
      ansible.builtin.set_fact:
        verify_failures: "{{ verify_failures + [verify_node ~ ' 内核 ' ~ (vf_uname.stdout | trim) ~ ' != ' ~ kernel_version] }}"
      when: (vf_uname.stdout | trim) != kernel_version

- name: "Read the hold list"  # 手册 9.1
  ansible.builtin.command: apt-mark showhold
  register: vf_holds
  changed_when: false

- name: "Record unheld K8s packages"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: "{{ verify_failures + [verify_node ~ ' 未 hold: ' ~ item] }}"
  loop: "{{ ['kubelet', 'kubeadm', 'kubectl', 'cri-tools'] | difference(vf_holds.stdout_lines) }}"

- name: "Read the inotify parameters"  # 手册 9.1
  ansible.builtin.command:
    cmd: sysctl -n fs.inotify.max_user_instances fs.inotify.max_user_watches fs.inotify.max_queued_events
  register: vf_inotify
  changed_when: false

- name: "Record inotify mismatches (expect 8192 / 1048576 / 65536)"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: "{{ verify_failures + [verify_node ~ ' inotify: ' ~ (vf_inotify.stdout | trim | replace('\n', ' '))] }}"
  when: vf_inotify.stdout | trim != '8192\n1048576\n65536'

- name: "Read the journald SystemMaxUse"  # 手册 9.1
  ansible.builtin.command: grep SystemMaxUse /etc/systemd/journald.conf.d/10-k8s-node.conf
  register: vf_journald
  changed_when: false
  failed_when: false

- name: "Record a journald mismatch (expect 4G)"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: "{{ verify_failures + [verify_node ~ ' journald SystemMaxUse 不符: ' ~ (vf_journald.stdout | default('缺失'))] }}"
  when: vf_journald.rc != 0 or vf_journald.stdout is not search(journald_system_max_use)

- name: "Verify swap is disabled"  # 手册 9.1
  ansible.builtin.command: cat /proc/swaps
  register: vf_swaps
  changed_when: false

- name: "Record that swap still exists"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: "{{ verify_failures + [verify_node ~ ' swap 未关闭'] }}"
  when: (vf_swaps.stdout_lines | length) > 1

- name: "Check master certificate lifetimes (leaf ~10y / CA ~20y)"  # 手册 9.1
  when: inventory_hostname in groups['masters']
  block:
    - name: "Run kubeadm certs check-expiration"
      ansible.builtin.command: kubeadm certs check-expiration
      register: vf_certs
      changed_when: false
      failed_when: false

    - name: "Record certificate check errors"
      ansible.builtin.set_fact:
        verify_failures: "{{ verify_failures + [verify_node ~ ' 证书检查异常（rc=' ~ vf_certs.rc ~ '）'] }}"
      when: vf_certs.rc != 0

    - name: "Print certificate lifetime details"
      ansible.builtin.debug:
        msg: "{{ vf_certs.stdout_lines | default([]) }}"

# ===================== 集群级检查（全部委托 master01） =====================
- name: "Verify every node is Ready"  # 手册 9.1
  ansible.builtin.command:
    cmd: kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  register: vf_nodes
  changed_when: false

- name: "Record nodes that are not Ready"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: "{{ verify_failures + ['未 Ready 节点 ' ~ ((vf_nodes.stdout_lines | reject('equalto', 'True')) | list | length) ~ ' 台'] }}"
  run_once: true
  when: (vf_nodes.stdout_lines | reject('equalto', 'True')) | list | length > 0

- name: "Verify node INTERNAL-IP is the internal IP (not the VIP)"  # 手册 9.1
  ansible.builtin.command:
    cmd: kubectl get nodes -o jsonpath='{range .items[*]}{.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}'
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  register: vf_node_ips
  changed_when: false

- name: "Record INTERNAL-IP anomalies"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: "{{ verify_failures + ['节点 INTERNAL-IP 含 ' ~ item ~ '（应为各节点内网 IP）'] }}"
  loop: "{{ [vip, ext_vip] }}"
  run_once: true
  when: item in vf_node_ips.stdout_lines

- name: "Verify system pods are Running or Completed"  # 手册 9.1
  ansible.builtin.command:
    cmd: kubectl get pods -A -o jsonpath='{range .items[*]}{.status.phase}{"\n"}{end}'
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  register: vf_pods
  changed_when: false

- name: "Record abnormal system pods"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: >-
      {{ verify_failures + ['非 Running/Succeeded Pod '
      ~ ((vf_pods.stdout_lines | reject('in', ['Running', 'Succeeded'])) | list | length) ~ ' 个'] }}
  run_once: true
  when: (vf_pods.stdout_lines | reject('in', ['Running', 'Succeeded'])) | list | length > 0

- name: "Verify offline purity: every image comes from {{ registry }}"  # 手册 9.1
  ansible.builtin.command:
    cmd: kubectl get pods -A -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.image}{"\n"}{end}{end}'
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  register: vf_images
  changed_when: false

- name: "Record images outside the internal registry"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: >-
      {{ verify_failures + ['公网/未知镜像: '
      ~ ((vf_images.stdout_lines | unique | reject('search', registry | regex_escape)) | list | join(', '))] }}
  run_once: true
  when: (vf_images.stdout_lines | unique | reject('search', registry | regex_escape)) | list | length > 0

- name: "Check apiserver readyz"  # 手册 9.1
  ansible.builtin.command:
    cmd: kubectl get --raw=/readyz?verbose
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  register: vf_readyz
  changed_when: false
  failed_when: false

- name: "Record readyz anomalies"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: "{{ verify_failures + ['readyz 未通过: ' ~ (vf_readyz.stdout | default('') | trim | splitlines() | last | default(''))] }}"
  run_once: true
  when: vf_readyz.rc != 0 or not (vf_readyz.stdout | default('') is search('readyz check passed'))

- name: "Check kube-proxy (nftables mode, nodePortAddresses on the internal subnet)"  # 手册 9.1
  ansible.builtin.shell: >-
    kubectl -n kube-system get cm kube-proxy -o yaml
    | grep -E 'mode:|nodePortAddresses' -A1
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  args:
    executable: /bin/bash
  register: vf_kubeproxy
  changed_when: false
  failed_when: false

- name: "Record kube-proxy configuration anomalies"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: "{{ verify_failures + ['kube-proxy 配置异常（期望 nftables + ' ~ node_cidr ~ '）'] }}"
  run_once: true
  when: vf_kubeproxy.rc != 0 or vf_kubeproxy.stdout is not search('nftables') or vf_kubeproxy.stdout is not search(node_cidr | regex_escape)

- name: "Verify Calico TigerStatus is Available"  # 手册 9.1
  ansible.builtin.command: kubectl get tigerastatus -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}'
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  register: vf_tiger
  changed_when: false
  failed_when: false

- name: "Record TigerStatus anomalies"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: "{{ verify_failures + ['TigerStatus 未全部 Ready: ' ~ (vf_tiger.stdout | trim | default(''))] }}"
  run_once: true
  when: (vf_tiger.stdout | trim).split(' ') | reject('equalto', 'True') | list | length > 0

- name: "Check the Calico IPPool (IPIP / blockSize 25 / natOutgoing)"  # 手册 9.1
  ansible.builtin.command:
    cmd: kubectl get ippools.projectcalico.org default-ipv4-ippool -o jsonpath='{.spec.ipipMode} {.spec.blockSize} {.spec.natOutgoing}'
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  register: vf_ippool
  changed_when: false
  failed_when: false

- name: "Record IPPool anomalies (expect Always 25 true)"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: "{{ verify_failures + ['IPPool 异常: ' ~ (vf_ippool.stdout | trim | default('缺失'))] }}"
  run_once: true
  when: vf_ippool.rc != 0 or (vf_ippool.stdout | trim) != 'Always 25 true'

- name: "Check Gateway PROGRAMMED and EXTERNAL-IP"  # 手册 9.1
  ansible.builtin.shell: >-
    kubectl -n envoy-gateway-system get gateway gw-ext --no-headers;
    kubectl -n envoy-gateway-system get svc --no-headers
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  args:
    executable: /bin/bash
  register: vf_gw
  changed_when: false
  failed_when: false

- name: "Record Gateway or entry IP anomalies"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: "{{ verify_failures + ['Gateway 或入口 IP 异常（期望 Programmed+True / ' ~ gw_ext_ip ~ '）'] }}"
  run_once: true
  when: vf_gw.rc != 0 or vf_gw.stdout is not search('True') or vf_gw.stdout is not search(gw_ext_ip | regex_escape)

- name: "Check etcd cluster health"  # 手册 9.1
  ansible.builtin.shell: >-
    crictl exec "$(crictl ps --name etcd -q | head -n1)"
    etcdctl --endpoints=https://127.0.0.1:2379
    --cacert=/etc/kubernetes/pki/etcd/ca.crt
    --cert=/etc/kubernetes/pki/etcd/server.crt
    --key=/etc/kubernetes/pki/etcd/server.key
    endpoint health --cluster
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  args:
    executable: /bin/bash
  register: vf_etcd
  changed_when: false
  failed_when: false

- name: "Record unhealthy etcd members"  # 手册 9.1
  ansible.builtin.set_fact:
    verify_failures: "{{ verify_failures + ['etcd 不健康成员 ' ~ ((vf_etcd.stdout_lines | reject('search', 'is healthy')) | list | length) ~ ' 个'] }}"
  run_once: true
  when: vf_etcd.rc != 0 or (vf_etcd.stdout_lines | reject('search', 'is healthy')) | list | length > 0

# ===================== 汇总 =====================
- name: "Summarize the verification"
  ansible.builtin.debug:
    msg: >-
      {{ '%s 验收 %s' | format(verify_node, '通过 ✓' if (verify_failures | length) == 0 else '存在 ' ~ (verify_failures | length) ~ ' 项失败') }}
  tags: [verify]

- name: "List per-node failures"
  ansible.builtin.debug:
    msg: "{{ verify_failures }}"
  when: verify_failures | length > 0

- name: "Abort on any failure (no half-passed acceptance)"
  ansible.builtin.assert:
    that: verify_failures | length == 0
    fail_msg: "验收未通过，见上方失败清单"
  tags: [verify]

# ===================== 手册 9.2 连通性（busybox_tag 非空才可用）=====================
- name: "DNS and cross-node connectivity tests (tag never, run with --tags connectivity)"  # 手册 9.2
  when: (busybox_tag | default('') | length > 0)
  block:
    - name: "Resolve kubernetes.default via DNS"
      ansible.builtin.command:
        cmd: kubectl run dns-test --rm -i --restart=Never --image={{ registry }}/busybox:{{ busybox_tag }} -- nslookup kubernetes.default
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      register: vf_dns
      changed_when: false
      failed_when: vf_dns.rc != 0

    - name: "Start two cross-node pods (first two workers, else master01 and master02)"
      ansible.builtin.command:
        cmd: >-
          kubectl run {{ item.name }} --image={{ registry }}/busybox:{{ busybox_tag }}
          --overrides='{"spec":{"nodeName":"{{ item.node }}"}}' -- sleep 300
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      loop:
        - { name: net-a, node: "{{ (groups['workers'] | default([]) + groups['masters'])[0] }}" }
        - { name: net-b, node: "{{ (groups['workers'] | default([]) + groups['masters'])[1] }}" }
      register: vf_net_pods
      changed_when: false

    - name: "Get the net-b pod IP"
      ansible.builtin.command:
        cmd: kubectl get pod net-b -o jsonpath='{.status.podIP}'
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      register: vf_netb_ip
      changed_when: false
      until: (vf_netb_ip.stdout | trim | length) > 0
      retries: 15
      delay: 4

    - name: "Ping net-b from net-a (cross-node pod connectivity)"
      ansible.builtin.command:
        cmd: kubectl exec net-a -- ping -c 3 {{ vf_netb_ip.stdout | trim }}
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      register: vf_ping
      changed_when: false
      failed_when: vf_ping.rc != 0

  always:
    - name: "Clean up the test pods"
      ansible.builtin.command:
        cmd: kubectl delete pod net-a net-b --ignore-not-found --wait=false
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      changed_when: false
  tags: [never, connectivity]

# ===================== VIP 漂移演练（never 标签）=====================
- name: "VIP failover drill: stop the holder haproxy, both VIPs must move (tag failover)"  # 手册 9.1；--tags failover
  block:
    - name: "Find the current VIP holder"
      ansible.builtin.shell: "ip -4 addr show | grep -w '{{ vip }}' >/dev/null && echo holder || echo ''"
      args:
        executable: /bin/bash
      register: vf_vip_holder
      changed_when: false
      failed_when: vf_vip_holder.stdout_lines | select('equalto', 'holder') | list | length > 1

    - name: "Stop haproxy on the holder"
      ansible.builtin.systemd:
        name: haproxy
        state: stopped
      when: (vf_vip_holder.stdout | trim) == 'holder'

    - name: "Wait for this node to release the VIP (weight -30 demotes)"
      ansible.builtin.shell: "ip -4 addr show | grep -w '{{ vip }}' || true"
      args:
        executable: /bin/bash
      register: vf_vip_after
      when: (vf_vip_holder.stdout | trim) == 'holder'
      changed_when: false
      until: vf_vip_after.stdout | trim | length == 0
      retries: 20
      delay: 3

    - name: "Verify another master took over the VIP (apiserver port reachable via VIP)"
      ansible.builtin.shell: >-
        timeout 5 bash -c 'echo > /dev/tcp/{{ vip }}/{{ vip_port }}' && echo takeover-ok
      args:
        executable: /bin/bash
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      register: vf_failover_check
      changed_when: false
      until: vf_failover_check.stdout | trim == 'takeover-ok'
      retries: 20
      delay: 3

  always:
    - name: "Restart local haproxy (restore the scene)"
      ansible.builtin.systemd:
        name: haproxy
        state: started
      when: (vf_vip_holder.stdout | trim) == 'holder'
  tags: [never, failover]
