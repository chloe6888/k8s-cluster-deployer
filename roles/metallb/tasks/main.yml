---
# 阶段 80：MetalLB 0.15.3 L2（手册第 7 章，只跑在 master01）。
# speaker 需特权：命名空间放行 Pod Security Admission。
- name: "Assert this runs on master01"
  ansible.builtin.assert:
    that: inventory_hostname == groups['masters'][0]

- name: "Fetch the MetalLB chart (verified on fetch)"  # 手册 7.2
  ansible.builtin.include_role:
    name: artifact
  vars:
    artifact_file: "metallb-{{ metallb_version }}.tgz"
  tags: [lb]

- name: "Render metallb-values.yaml (offline image overrides)"  # 手册 7.1
  ansible.builtin.template:
    src: metallb-values.yaml.j2
    dest: "{{ package_dir }}/charts/metallb-values.yaml"
    mode: "0644"
  tags: [lb]

- name: "Verify all rendered images point at {{ registry }}"  # 手册 7.2；controller/speaker/frr 三处
  ansible.builtin.shell: >-
    helm template metallb {{ package_dir }}/charts/metallb-{{ metallb_version }}.tgz
    -n metallb-system -f {{ package_dir }}/charts/metallb-values.yaml
    | grep -E 'image:' | sort -u
  args:
    executable: /bin/bash
  register: lb_images
  changed_when: false
  failed_when: >-
    lb_images.stdout_lines | length < 3
    or (lb_images.stdout_lines | reject('search', registry | regex_escape) | list | length) > 0
  tags: [lb]

- name: "Create the metallb-system namespace"  # 手册 7.2
  ansible.builtin.shell: >-
    kubectl create namespace metallb-system --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  register: lb_ns
  changed_when: "'created' in lb_ns.stdout"
  tags: [lb]

- name: "Allow Pod Security Admission for the privileged speaker"  # 手册 7.2
  ansible.builtin.command:
    cmd: >-
      kubectl label namespace metallb-system
      pod-security.kubernetes.io/enforce=privileged
      pod-security.kubernetes.io/audit=privileged
      pod-security.kubernetes.io/warn=privileged --overwrite
  changed_when: false
  tags: [lb]

- name: "Run helm upgrade --install metallb"  # 手册 7.2
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install metallb {{ package_dir }}/charts/metallb-{{ metallb_version }}.tgz
      -n metallb-system -f {{ package_dir }}/charts/metallb-values.yaml
  register: lb_install
  changed_when: "'has been upgraded' in lb_install.stdout or 'deployed' in lb_install.stdout"
  tags: [lb]

- name: "Wait for metallb-controller to be ready"  # 手册 7.2
  ansible.builtin.command:
    cmd: kubectl -n metallb-system rollout status deployment/metallb-controller --timeout=5m
  changed_when: false
  tags: [lb, verify]

- name: "Wait for metallb-speaker to be ready"  # 手册 7.2
  ansible.builtin.command:
    cmd: kubectl -n metallb-system rollout status daemonset/metallb-speaker --timeout=5m
  changed_when: false
  tags: [lb, verify]

# ---- 7.3 外网地址池（webhook 未就绪会报错，自动重试）----
- name: "Render the address pool and L2 advertisement"  # 手册 7.3
  ansible.builtin.template:
    src: metallb-pool.yaml.j2
    dest: "{{ package_dir }}/charts/metallb-pool.yaml"
    mode: "0644"
  tags: [lb]

- name: "Apply the address pool (retries while the webhook warms up)"  # 手册 7.3
  ansible.builtin.command:
    cmd: kubectl apply -f {{ package_dir }}/charts/metallb-pool.yaml
  register: lb_pool_apply
  changed_when: "'created' in lb_pool_apply.stdout or 'configured' in lb_pool_apply.stdout"
  until: lb_pool_apply.rc == 0
  retries: 10
  delay: 10
  tags: [lb]

- name: "Verify pool-ext and l2-ext exist"  # 手册 7.3
  ansible.builtin.command:
    cmd: kubectl -n metallb-system get ipaddresspool,l2advertisement
  register: lb_pool
  changed_when: false
  failed_when: >-
    lb_pool.stdout is not search('pool-ext') or lb_pool.stdout is not search('l2-ext')
  tags: [lb, verify]
