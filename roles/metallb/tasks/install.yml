---
# MetalLB L2（手册第 7 章），只在 first_master 上执行。
# speaker 需特权：命名空间放行 Pod Security Admission。
- name: Install MetalLB
  tags: [lb]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  module_defaults:
    ansible.builtin.shell:
      executable: /bin/bash
  block:
    # calico 已建 charts 目录，但本 role 单独重跑时也要能自举
    - name: Create the charts directory
      ansible.builtin.file:
        path: "{{ package_dir }}/charts"
        state: directory
        mode: "0755"

    # 手册 7.2：获取 Chart（获取即校验）
    - name: Fetch the MetalLB chart
      ansible.builtin.import_role:
        name: artifact
      vars:
        artifact_file: "metallb-{{ metallb_version }}.tgz"

    # 手册 7.1：离线镜像覆盖
    - name: Render metallb-values.yaml
      ansible.builtin.template:
        src: metallb-values.yaml.j2
        dest: "{{ package_dir }}/charts/metallb-values.yaml"
        mode: "0644"

    # 手册 7.2：controller/speaker/frr 三处镜像必须都来自 Harbor
    - name: Verify all rendered images point at {{ registry }}
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          helm template metallb {{ package_dir }}/metallb-{{ metallb_version }}.tgz \
            -n metallb-system -f {{ package_dir }}/charts/metallb-values.yaml | grep -E 'image:' | sort -u
      register: lb_images
      changed_when: false
      failed_when: >-
        lb_images.stdout_lines | length < 3
        or (lb_images.stdout_lines | reject('search', registry | regex_escape) | list | length) > 0
      check_mode: false

    # 手册 7.2
    - name: Create the metallb-system namespace
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          kubectl create namespace metallb-system --dry-run=client -o yaml | kubectl apply -f -
      register: lb_ns
      changed_when: "'created' in lb_ns.stdout"

    # 手册 7.2：speaker 是特权 DaemonSet，命名空间必须放行 PSA
    - name: Allow Pod Security Admission for the privileged speaker
      ansible.builtin.command:
        cmd: >-
          kubectl label namespace metallb-system
          pod-security.kubernetes.io/enforce=privileged
          pod-security.kubernetes.io/audit=privileged
          pod-security.kubernetes.io/warn=privileged --overwrite
      register: lb_label
      changed_when: "'not labeled' not in lb_label.stdout"

    # 手册 7.2：helm upgrade 每次都产生新 revision，先比较 chart 与 values 再决定是否执行
    - name: Read the current MetalLB release
      ansible.builtin.command:
        cmd: helm list -n metallb-system --filter '^metallb$' -o json
      register: lb_release
      changed_when: false
      check_mode: false

    # 手册 7.2：release 不存在时此命令失败，stdout 为空，failed_when: false 放行
    - name: Read the current MetalLB release values
      ansible.builtin.command:
        cmd: helm get values metallb -n metallb-system -o json
      register: lb_release_values
      changed_when: false
      failed_when: false
      check_mode: false

    # 手册 7.2：lookup 在控制机渲染模板，与目标机上渲染的 values 内容一致
    - name: Install or upgrade MetalLB
      when: >-
        (lb_release.stdout | from_json | length) == 0
        or (lb_release.stdout | from_json | first).chart != 'metallb-' ~ metallb_version
        or (lb_release_values.stdout | from_json)
           != (lookup('ansible.builtin.template', 'metallb-values.yaml.j2') | from_yaml)
      ansible.builtin.command:
        cmd: >-
          helm upgrade --install metallb {{ package_dir }}/metallb-{{ metallb_version }}.tgz
          -n metallb-system -f {{ package_dir }}/charts/metallb-values.yaml --history-max 5
      changed_when: true

    - name: Wait for metallb-controller to be ready
      ansible.builtin.command:
        cmd: kubectl -n metallb-system rollout status deployment/metallb-controller --timeout=5m
      changed_when: false
      check_mode: false

    - name: Wait for metallb-speaker to be ready
      ansible.builtin.command:
        cmd: kubectl -n metallb-system rollout status daemonset/metallb-speaker --timeout=5m
      changed_when: false
      check_mode: false

    # 手册 7.3：地址池由 template 渲染，唯一事实源在 group_vars
    - name: Render the address pool and L2 advertisement
      ansible.builtin.template:
        src: metallb-pool.yaml.j2
        dest: "{{ package_dir }}/charts/metallb-pool.yaml"
        mode: "0644"

    # 手册 7.3：webhook 未就绪会报错，约 100 秒：10 次 × 10 秒
    - name: Apply the address pool
      ansible.builtin.command:
        cmd: kubectl apply -f {{ package_dir }}/charts/metallb-pool.yaml
      register: lb_pool_apply
      until: lb_pool_apply.rc == 0
      retries: 10
      delay: 10
      changed_when: "'created' in lb_pool_apply.stdout or 'configured' in lb_pool_apply.stdout"
