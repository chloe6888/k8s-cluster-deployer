---
# 阶段 11：固定并锁定内核（手册 2.5）。单独 playbook 执行；pin_kernel=false 时整段跳过。
# master 逐台、worker 按 worker_batch_size 分批由 playbook 的 serial 控制。
- name: "Assert the target kernel candidate exists on the internal mirror"  # 手册 2.5①
  ansible.builtin.command:
    cmd: "apt-cache policy linux-image-{{ kernel_version }}"
  register: kernel_policy
  changed_when: false
  failed_when: kernel_policy.stdout is search('Candidate:[ ]+\\(none\\)')
  tags: [os, kernel]

- name: "Install the four target kernel packages"  # 手册 2.5①
  ansible.builtin.apt:
    name:
      - "linux-image-{{ kernel_version }}"
      - "linux-headers-{{ kernel_version }}"
      - "linux-modules-{{ kernel_version }}"
      - "linux-modules-extra-{{ kernel_version }}"
    state: present
    update_cache: false
  register: kernel_install
  tags: [os, kernel]

- name: "Verify vmlinuz and initrd.img exist under /boot"  # 手册 2.5①
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "/boot/vmlinuz-{{ kernel_version }}"
    - "/boot/initrd.img-{{ kernel_version }}"
  register: kernel_boot_files
  failed_when: not kernel_boot_files.results[idx].stat.exists
  loop_control:
    index_var: idx
  tags: [os, kernel]

- name: "Read the running kernel"
  ansible.builtin.command:
    cmd: uname -r
  register: kernel_uname
  changed_when: false
  tags: [os, kernel]

- name: "Pin the GRUB entry and reboot when the running kernel differs"  # 手册 2.5②
  when: kernel_uname.stdout | trim != kernel_version
  block:
    - name: "Ensure no grub.d file overrides GRUB_DEFAULT"
      ansible.builtin.command:
        cmd: grep -rn GRUB_DEFAULT /etc/default/grub /etc/default/grub.d/
      register: kernel_grub_override
      changed_when: false
      failed_when: (kernel_grub_override.stdout_lines | select('match', '^/etc/default/grub\.d/') | list | length) > 0

    - name: "Update grub (target kernel must enter the menu)"
      ansible.builtin.command:
        cmd: update-grub
      changed_when: false

    - name: "Verify the target kernel title is in the menu"
      ansible.builtin.command:
        cmd: "grep -n \"with Linux {{ kernel_version }}'\" /boot/grub/grub.cfg"
      register: kernel_menu_entry
      changed_when: false
      failed_when: kernel_menu_entry.rc != 0

    - name: "Pin GRUB_DEFAULT to the target kernel entry"
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_DEFAULT='
        line: 'GRUB_DEFAULT="Advanced options for Ubuntu>Ubuntu, with Linux {{ kernel_version }}"'

    - name: "Update grub again"
      ansible.builtin.command:
        cmd: update-grub
      changed_when: false

    - name: "Reboot the node (serial keeps it one at a time)"
      ansible.builtin.reboot:
        reboot_timeout: 600
        pre_reboot_delay: 5

    - name: "Verify the running kernel after reboot"
      ansible.builtin.command:
        cmd: uname -r
      register: kernel_uname_after
      changed_when: false
      failed_when: kernel_uname_after.stdout | trim != kernel_version
  tags: [os, kernel]

- name: "Purge other kernels (only when purge_old_kernels=true)"  # 手册 2.5④
  when: purge_old_kernels | bool
  block:
    - name: "Build the list of packages to remove"  # 运行中的目标内核不会被卸载
      ansible.builtin.shell: |
        set -o pipefail
        dpkg -l | awk '/^ii  linux-(image|image-unsigned|headers|modules|modules-extra)-[0-9]/ {print $2}' \
          | grep -v -- "{{ kernel_version.rsplit('-', 1)[0] }}" || true
      args: { executable: /bin/bash }
      register: kernel_purge_list
      changed_when: false

    - name: "Show the removal list for review"
      ansible.builtin.debug:
        msg: "{{ kernel_purge_list.stdout_lines or ['（无待移除内核包）'] }}"

    - name: "Assert the list excludes kubelet, containerd and other unrelated packages"
      ansible.builtin.assert:
        that: kernel_purge_list.stdout_lines | reject('match', '^linux-') | list | length == 0
        fail_msg: "待移除清单出现非 linux-* 包，中止：{{ kernel_purge_list.stdout_lines }}"
        quiet: true

    - name: "Remove old kernels"
      ansible.builtin.apt:
        name: "{{ kernel_purge_list.stdout_lines }}"
        state: absent
        purge: true
      when: kernel_purge_list.stdout_lines | length > 0

    - name: "Restore GRUB_DEFAULT=0 when only one kernel remains"
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_DEFAULT='
        line: 'GRUB_DEFAULT=0'
      notify: Update grub

    - name: "Verify /boot contains only the target kernel"
      ansible.builtin.command:
        cmd: ls /boot/vmlinuz-*
      register: kernel_boot_left
      changed_when: false
      failed_when: kernel_boot_left.stdout_lines | length != 1 or kernel_version not in kernel_boot_left.stdout
  tags: [os, kernel]

- name: "Hold the four kernel packages"  # 手册 2.5⑤
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - "linux-image-{{ kernel_version }}"
    - "linux-headers-{{ kernel_version }}"
    - "linux-modules-{{ kernel_version }}"
    - "linux-modules-extra-{{ kernel_version }}"
  tags: [os, kernel]

- name: "Collect installed package facts for meta-package filtering"  # 手册 2.5⑤
  ansible.builtin.package_facts:
  tags: [os, kernel]

- name: "Hold installed kernel meta-packages"  # 手册 2.5⑤
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kernel_meta_packages }}"
  when: "ansible_facts.packages[item] is defined"
  tags: [os, kernel]

- name: "Disable auto-upgrades (set 20auto-upgrades to 0)"  # 手册 2.5⑥
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/20auto-upgrades
    regexp: '^\s*Unattended-Upgrade\s'
    line: 'Unattended-Upgrade "0";'
    create: true
    mode: "0644"
  tags: [os, kernel]

- name: "Stop and disable unattended-upgrades and apt-daily-upgrade.timer"  # 手册 2.5⑥
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [unattended-upgrades, apt-daily-upgrade.timer]
  tags: [os, kernel]

- name: "Verify the running kernel and hold list"
  block:
    - name: "Read uname and showhold"
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop: [uname -r, apt-mark showhold]
      register: kernel_verify
      changed_when: false

    - name: "Assert the expected kernel and holds"
      ansible.builtin.assert:
        that:
          - kernel_verify.results[0].stdout | trim == kernel_version
          - kernel_verify.results[1].stdout is search('linux-image-' ~ kernel_version)
          - kernel_verify.results[1].stdout is search('linux-modules-extra-' ~ kernel_version)
        quiet: true
  tags: [os, kernel, verify]
