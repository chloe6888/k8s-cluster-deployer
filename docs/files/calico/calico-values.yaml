# Calico 3.32.0 Tigera Operator Helm values（对应部署文档 9.3）
# 前提：CRD Chart（crd.projectcalico.org.v1-v3.32.0.tgz）已先行安装（文档 9.2）
# 安装：helm upgrade --install calico ./tigera-operator-v3.32.0.tgz -n tigera-operator -f calico-values.yaml
#
# 要点：
# - installation.registry 带结尾斜杠、imagePath: calico → 镜像 ${REGISTRY}/calico/node 等
# - tigeraOperator.registry 不带斜杠 → ${REGISTRY}/tigera/operator
# - BGP full-mesh 是默认行为，不在此创建 BGPConfiguration/RR
# - nodeAddressAutodetectionV4.interface 必须匹配所有节点内网网卡、不匹配外网网卡
# - 安装前强制：helm template calico ./tigera-operator-v3.32.0.tgz -n tigera-operator \
#     -f calico-values.yaml | grep -E 'image:' | sort -u   # 全部指向 ${REGISTRY} 且已推 Harbor
installation:
  enabled: true
  registry: ${REGISTRY}/            # 带结尾斜杠
  imagePath: calico
  calicoNetwork:
    bgp: Enabled
    nodeAddressAutodetectionV4:
      interface: "^${NODE_IFACE}$"
    ipPools:
      - cidr: ${POD_CIDR}
        encapsulation: IPIP         # Always；同层可评估 CrossSubnet（文档附录 B）
        natOutgoing: Enabled
        blockSize: 25
        nodeSelector: all()
apiServer:
  enabled: true
goldmane:
  enabled: false
whisker:
  enabled: false
tigeraOperator:
  image: tigera/operator
  version: v1.42.0                  # 待验证：以 helm show values 默认值为准
  registry: ${REGISTRY}            # 不带结尾斜杠
