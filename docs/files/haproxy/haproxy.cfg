# HAProxy 配置模板 —— Kubernetes API 高可用入口（对应部署文档 6.1）
# 部署位置：3 台 master 均相同，/etc/haproxy/haproxy.cfg
# 生成方式：source /etc/k8s-deploy.env 后按文档 6.1 的 heredoc 展开（${...} 来自该 env 文件）
#
# 设计要点：
# - 两个 frontend 分别显式绑内/外 VIP:16443（不是 *:16443 通配），
#   这样外网入口才能单独做源地址 ACL；依赖 sysctl net.ipv4.ip_nonlocal_bind=1
#   （VIP 未漂到本机时 HAProxy 也要能启动）。
# - 后端同为 3 台 master 内网 IP:6443；httpchk GET /healthz 匿名可访问
#   （system:public-info-viewer）。若日后 apiserver 关闭 --anonymous-auth，
#   /healthz 返回 401，需删除三行 httpchk 并换回 option ssl-hello-chk。
# - 统计页只绑本机内网 IP:8888，账号密码来自 ${STATS_AUTH}（必须改强密码）。

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 3600s        # 必须大于最长的 watch/exec/attach/port-forward 会话
    timeout server 3600s
    timeout tunnel 3600s

frontend kube-apiserver-internal
    bind ${VIP}:${VIP_PORT}
    default_backend kube-apiserver-backend

frontend kube-apiserver-external-ops
    bind ${EXT_VIP}:${VIP_PORT}
    tcp-request connection reject if !{ src ${EXT_API_ALLOWED_CIDR} }
    default_backend kube-apiserver-backend

backend kube-apiserver-backend
    balance roundrobin
    option httpchk GET /healthz
    http-check connect ssl verify none
    http-check expect status 200
    default-server inter 2s fall 3 rise 2
    server master01 ${MASTER01_IP}:6443 check
    server master02 ${MASTER02_IP}:6443 check
    server master03 ${MASTER03_IP}:6443 check

listen stats
    mode http
    bind ${NODE_IP}:8888
    stats auth ${STATS_AUTH}
    stats refresh 5s
    stats uri /stats
