# Keepalived 配置模板 —— 内外 API VIP 独立漂移（对应部署文档 6.3）
# 部署位置：3 台 master 的 /etc/keepalived/keepalived.conf（chmod 600）
# 生成方式：source /etc/k8s-deploy.env 后按文档 6.3 的 heredoc 展开
#
# 各节点差异（仅 KA_STATE / KA_PRIORITY 两处，其余完全相同）：
#   ┌──────────┬────────┬──────────┐
#   │ 节点      │ state  │ priority │
#   ├──────────┼────────┼──────────┤
#   │ master01 │ MASTER │   100    │
#   │ master02 │ BACKUP │    90    │
#   │ master03 │ BACKUP │    80    │
#   └──────────┴────────┴──────────┘
#
# 设计要点：
# - 内/外两个 VIP 独立漂移（不使用 vrrp_sync_group）：外网网络更不稳定，
#   同步组会让外网 VRRP 抖动连累内网 VIP；两 VIP 允许落到不同 master。
# - 同节点两实例优先级一致 + weight -30：HAProxy 死亡时 100-30=70 < 90，
#   两个 VIP 一起迁移；仅外网层故障时只有外网 VIP 迁移。
# - 默认组播（VRRP 协议 112 / 224.0.0.18）。若内外任一二层禁组播，
#   启用下方注释的单播段（网络侧仍需放通协议 112）。
# - 认证口令 KA_AUTH_PASS ≤ 8 位；文件含口令，权限 600。
# - 默认抢占开启：master01 恢复后 VIP 抢回，上线前在测试环境验证。

global_defs {
    router_id ${NODE_NAME}              # 或 $(hostname)
    script_user root
    enable_script_security
}

vrrp_script checkhaproxy {
    script "/etc/keepalived/check-haproxy.sh"
    interval 2
    timeout 3
    weight -30
    fall 2
    rise 1
    init_fail
}

# ---------- 实例一：内网 API VIP（controlPlaneEndpoint 使用） ----------
vrrp_instance VI_API_INTERNAL {
    state ${KA_STATE}
    interface ${NODE_IFACE}
    virtual_router_id ${KA_VRID}
    priority ${KA_PRIORITY}
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass ${KA_AUTH_PASS}
    }
    # --- 单播变体（内网二层禁组播时启用，注释删除）---
    # unicast_src_ip <本机内网IP>
    # unicast_peer {
    #     <master02内网IP>
    #     <master03内网IP>
    # }
    virtual_ipaddress {
        ${VIP}/${VIP_PREFIX} dev ${NODE_IFACE}
    }
    track_script {
        checkhaproxy
    }
}

# ---------- 实例二：外网 API VIP（外部运维 kubectl/API 入口） ----------
vrrp_instance VI_API_EXTERNAL {
    state ${KA_STATE}
    interface ${EXT_IFACE}
    virtual_router_id ${KA_EXT_VRID}
    priority ${KA_PRIORITY}
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass ${KA_AUTH_PASS}
    }
    # --- 单播变体（外网二层禁组播时启用）---
    # unicast_src_ip <本机外网IP>
    # unicast_peer {
    #     <master02外网IP>
    #     <master03外网IP>
    # }
    virtual_ipaddress {
        ${EXT_VIP}/${EXT_VIP_PREFIX} dev ${EXT_IFACE}
    }
    track_script {
        checkhaproxy
    }
}
