# EnvoyProxy 数据面 + GatewayClass（对应部署文档 11.3）
# 前提：metallb 已装且 pool-ext 已建（文档 10.3）；本文件 apply 后再建 Gateway（11.4）
#
# 要点：
# - 数据面镜像在此指定：${REGISTRY}/envoyproxy/envoy:distroless-v1.37.1（须已推 Harbor）
# - replicas: 2；externalTrafficPolicy: Cluster（不做源 IP 保留）
# - ${GW_EXT_IP} 必须属于 ${METALLB_EXT_RANGE}，Service 固定该 IP
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: proxy-ext
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          image: ${REGISTRY}/envoyproxy/envoy:distroless-v1.37.1
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          metallb.io/address-pool: pool-ext
          metallb.io/loadBalancerIPs: ${GW_EXT_IP}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: proxy-ext
    namespace: envoy-gateway-system
