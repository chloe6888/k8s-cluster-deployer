---
# 阶段 99：重置集群（独立执行，不入 site.yml；worker 先于 master）。
# 双确认门禁：ansible-playbook playbooks/reset.yml -e confirm_reset=yes
- name: "Reset workers"
  hosts: workers
  gather_facts: false
  vars_files: ../config/versions.yml
  roles:
    - common
    - reset

- name: "Reset masters (one at a time)"
  hosts: masters
  gather_facts: false
  serial: 1
  vars_files: ../config/versions.yml
  roles:
    - common
    - reset
