---
# 内核固定（手册 2.5，会重启节点；独立执行，不入 site.yml）。
# 开启条件：group_vars 中 pin_kernel: true。任务带 never 标签，须显式指定标签运行：
#   ansible-playbook playbooks/kernel-pin.yml --tags os
- name: Pin the kernel and reboot
  hosts: k8s_all
  gather_facts: true
  serial: 1
  vars_files: ../config/versions.yml
  roles:
    - role: common
    - role: kernel_pin
      when: pin_kernel | bool
  tags: [os]
