---
# 高可用入口（手册 3.1–3.6 + 3.8/3.9 启动次序）。
# 三段：并行装配置 → serial:1 按序拉起（master01 先持 VIP）→ 汇总验证。
- name: Install and configure HAProxy and keepalived (masters in parallel)
  hosts: masters
  gather_facts: true
  vars_files: ../config/versions.yml
  roles:
    - common
    - ha_entry
  tags: [ha]

- name: Bring up serially by priority (master01 holds both VIPs first)
  hosts: masters
  gather_facts: false
  serial: 1
  vars_files: ../config/versions.yml
  roles:
    - ha_keepalived
  tags: [ha]

- name: Verify both VIPs from master01 (single-point check)
  hosts: first_master
  gather_facts: false
  vars_files: ../config/versions.yml
  module_defaults:
    ansible.builtin.shell:
      executable: /bin/bash
  tags: [ha, verify]
  tasks:
    - name: Verify the HA entry
      block:
        # 手册 3.9：两个 VIP 都应落在 master01（priority 最高）
        - name: Assert master01 holds both the internal and external VIPs
          ansible.builtin.command:
            cmd: ip -4 addr show
          register: ha_final_vips
          changed_when: false
          failed_when: >-
            ha_final_vips.stdout is not search((vip | regex_escape) ~ '/')
            or ha_final_vips.stdout is not search((ext_vip | regex_escape) ~ '/')
          check_mode: false

        # 手册 3.9：只探 HAProxy 端口，不带 TLS
        - name: Probe apiserver via the internal VIP
          ansible.builtin.shell:
            cmd: |
              timeout 5 bash -c 'echo > /dev/tcp/{{ vip }}/{{ vip_port }}' && echo port-ok
          register: ha_final_port
          changed_when: false
          failed_when: ha_final_port.stdout | trim != 'port-ok'
          check_mode: false

        - name: Print VIP ownership and listening ports
          ansible.builtin.debug:
            msg:
              - "两个 VIP 均在 {{ node_name }}：通过"
              - "HAProxy 已在 {{ vip }}:{{ vip_port }} 监听：通过"
