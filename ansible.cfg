# Ansible 控制机配置（实施方案 §2：forks=20、pipelining、collections_path）
[defaults]
# 刻意不设默认 inventory：多集群工程必须显式 -i inventories/<集群>，防跑错对象
roles_path = roles
collections_path = collections
forks = 20
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
result_format = yaml
# vault 密码文件建议用 --vault-password-file 显式传入，不在配置里写死

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
